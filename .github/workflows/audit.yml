name: audit
# Tripwire for the one privileged actor: the orchestrator's bot may push state commits directly
# to main. This job fails (and GitHub emails you) if any direct commit touched anything else.
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - run: pip install pyyaml && python3 scripts/audit_main.py --since "2 days ago"
