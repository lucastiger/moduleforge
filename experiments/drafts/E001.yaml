id: E001
title: L2 reference validation against closed-form partial and loop inductances (bars, round-wire chains, image plane, 5/20/80 MHz)
objective: O001
status: draft
runner: uv run python experiments/runners/e001_reference.py
config:
  # Number literals carry an explicit exponent sign (5.0e+6, not 5.0e6): mfos loads specs with PyYAML
  # (YAML 1.1), which reads 5.0e6 as the string '5.0e6' (T0041). The runner also type-checks every key.
  # frequencies (Hz): LF comparison for the DC closed forms of bars; HF set used by O001 (F4) and E002
  f_lf_hz: 100.0
  freqs_hf_hz: [5.0e+6, 2.0e+7, 8.0e+7]
  # conductivities (S/m): annealed copper (IEC 60028, 100 % IACS); 99.99 % Al (resistivity 2.65e-8 ohm m)
  sigma_cu: 5.8e+7
  sigma_al: 3.77e+7
  # C1 floating plane extends this far beyond the 10 x 5 mm loop footprint on every side
  plane_margin_mm: 15.0
  # pre-registered refinement rule: levels start, start+1, ... (at least refinement_min_levels); stop when the
  # estimated remaining discretization error (remaining_discretization_error: observed-ratio geometric tail x 1.25
  # when the ratio is steady; x 3 and the larger of geometric and additive-refinement tails when it decelerates)
  # of every L is below conv_tol, or at refinement_max
  refinement_start: 1
  refinement_max: 5
  refinement_min_levels: 4
  # L2 contract sec. 3: constant refinement ratio; realized meta['mesh_h'] ratios >= refinement_ratio_min and
  # max/min <= refinement_ratio_spread
  refinement_ratio_min: 1.25
  refinement_ratio_spread: 1.1
  conv_tol: 0.01
  # L error allowed from the linear solve; the runner requires meta['solver_tol'] (forward-error bound of Z,
  # conditioning included) <= budget / amplification, amplification = |Z|max / (omega |L|min) of the closed form
  # (48-99 for the 100 Hz bars, up to ~2400 for the 100 Hz wire cases); 2 x budget x |L| is also the change two
  # refinement levels can show from the solver alone (noise floor of the refinement rule)
  solver_err_budget: 1.0e-4
  recip_tol: 1.0e-3
  monotone_tol: 1.0e-3
  scaling_tol: 0.01
  scaling_cases: [A1, B2, C1]
  tol_published: 1.0e-9
  # numerical-quadrature comparisons (Hoer-Love vs 6-D Gauss-Legendre, image term vs Neumann quadrature)
  tol_independent: 1.0e-6
  tol_truncation: 1.0e-3
  # one or more cases of every one of the 7 geometry classes
  smoke_cases: [A1, A3, B2, B3, B4, C0, C1]
  # registered case set (build_cases filters by it); geometry is defined in the runner (build_cases) and in
  # research/notes/o001-l2-reference.md section 4
  cases: [A1, A2, A3, A4, B1, B2, B3, B4, C0, C1]
sealed_seed: false
metrics:
  - name: max_rel_err_vs_analytic
    description: >-
      max over cases, compared quantities (L11, M12, L22) and frequencies of |L2 - closed form| / |closed form|,
      L2 at the finest level reached by the pre-registered refinement rule. Interval (level 0.95) = estimated
      error band [max_i (err_i - u_i)+, max_i (err_i + u_i)], u_i = estimated remaining discretization error
      (GCI-type, Roache's factors, nominal ~95 % coverage) + stated residual model error of the closed form (note
      sec. 4.3); not a sampling CI (the cases are deterministic) and not a guaranteed bound (review T0052).
    unit: ''
  - {name: max_rel_err_hf, description: same maximum restricted to 5/20/80 MHz comparisons, unit: ''}
  - {name: max_rel_err_lf, description: same maximum restricted to the LF (100 Hz) comparisons, unit: ''}
  - {name: analytic_value_span, description: diversity statistic - max/min of the compared closed-form values, unit: ''}
  - {name: n_geometry_classes, description: number of distinct geometry classes compared (design has 7), unit: ''}
sanity_checks:
  - name: closed_forms_published_values
    description: >-
      Kelvin ber/bei at x=1,2,5 vs exact rational series; rectangle GMD of a square = 0.44705 a and thin-strip
      limit e^-1.5 w (Grover); round-wire internal impedance DC and HF limits; reaction-weighted mean distance
      128 r/(45 pi) (uniform), r^2, 5r^4/3 and -> 4r/pi (surface); current-profile normalisation; dipole response
      chi -> j (r/delta)^2/4 at DC and -> 1 for a perfect conductor
  - name: closed_forms_independent_check
    description: >-
      Hoer-Love mutual vs 6-D Gauss-Legendre; filament formula vs quadrature; Bessel series vs Hankel asymptotics;
      Hoer-Love self vs GMD formula and thin-bar -> filament limit; rectangle partial sum vs Grover closed form
      (thin limit); Bessel internal impedance vs reaction integral with the log kernel; corrected round-wire self
      term vs an independent axisymmetric tube PEEC (solves the current distribution) for l = 1.5, 5, 10 mm at
      every compared frequency within the stated bound; proximity dipole vs the exact two-wire line (PEC);
      finite cross-section of mutuals (filament + mean-value term) vs a brute-force average of the filament
      kernel over both Bessel-profile cross-sections (B3 M12 at 100 Hz and 80 MHz, C1 wire-image pairs at
      20 MHz) within the stated remainder bound (d)
  - name: image_plane_independent
    description: >-
      the runner's 3-D image term (C1 loop at 5/20/80 MHz and an open U path at 20 MHz) vs a generic Neumann
      quadrature against the explicitly mirrored polyline (image current reversed), filaments on the axes (the
      finite cross-section is checked in closed_forms_independent_check), relative <= tol_independent
  - name: wheeler_recession_independent
    description: >-
      per-unit-length inductance increment of a line current 1 mm over the recessed image plane vs Carson's exact
      half-space integral at 0.5/5/20/80 MHz; |difference| <= mu0/2pi (delta/2h)^2 (the stated second-order term)
  - name: tied_branch_independent
    description: >-
      tie assembly (B4 and an asymmetric pair) vs the explicit parallel formula (Z11 Z22 - Z12 Z21)/(Z11 + Z22 -
      Z12 - Z21) of the corresponding two-port, relative <= 1e-10
  - name: analytic_length_scaling
    description: every closed-form case value doubles (rtol 1e-9) when all lengths double and f -> f/4
  - name: regime_valid
    description: >-
      assumptions of each closed form hold for the registered geometry - LF bars show < 1e-3 internal-inductance
      skin deficit (round-wire bound); plane delta/t <= 0.2 and (delta/2h)^2 <= 1e-3 at every plane frequency
  - name: plane_truncation_bound
    description: 2-D PEC-strip BEM (validated to 2e-4 against the infinite image) bounds C1 finite-plane truncation below 1e-3
  - name: l2_converged
    description: >-
      estimated remaining discretization error (remaining_discretization_error over >= refinement_min_levels
      levels, solver noise floor 2 x solver_err_budget) of every L2 value < conv_tol relative at the finest level
      of the pre-registered rule
  - name: l2_solver_tolerance
    description: >-
      every L2 solve reports meta['solver_tol'] (relative forward-error bound of Z from the linear algebra,
      compression and output rounding, conditioning included) <= solver_err_budget / amplification of its case
      (contract sec. 3)
  - name: l2_constant_refinement_ratio
    description: >-
      every solve sequence reports meta['mesh_h'] at each level; realized ratios h_k/h_(k+1) all >=
      refinement_ratio_min and max/min <= refinement_ratio_spread (contract sec. 3; the geometric model of the
      refinement rule needs a constant ratio; additive refinement such as n = k or 2k+1 fails)
  - name: l2_one_mesh_per_solve
    description: >-
      every L2 solve reports one mesh (integer meta['n_filaments']) used for all frequencies of the call
  - name: reciprocity
    description: "|Z12 - Z21| / |Z12| <= 1e-3 for every two-port case and frequency"
  - name: l_monotone_in_frequency
    description: >-
      driving-point Im(Z11)/omega never increases with frequency by more than 0.1% (RL driving-point theorem;
      valid because one mesh serves all frequencies of a solve)
  - name: length_scaling
    description: L2 with all lengths doubled and f -> f/4 returns 2 L within 1% (A1, B2, C1)
timeout_min: 240
cpu_hours_est: 2.0
