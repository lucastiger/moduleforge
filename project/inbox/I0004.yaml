subject: '[O001] approve initial plan (8 tasks)'
summary: 'O001 starts from zero. The repository holds only the O000 canary: there is no geometry IR, generator,
  L1 model, L2 reference or experiment design, and there is no evidence yet (0 of 3 evaluations used,
  $0 of $120 spent). The hypothesis is most likely to die on F3, missing physics. L1 represents the DBC
  backside copper and baseplate as image planes and bond-wire coupling as Grover filaments, which could
  bias L_loop by more than 20% (K2) or reorder layouts with similar loop areas (K1/K3). A second, cheaper
  risk is the 50 ms single-core budget (A6), especially if JAX recompiles for each layout shape. Neither
  risk can be judged until the reference itself is trustworthy (F1) and legally usable (F6). So the plan
  starts with a scientist task that audits the reference tool and pre-registers E001 against closed forms
  before L2 is built. The L2 builder must pass E001''s smoke cases at the 2% threshold before merging,
  and the L1 builder must pass a single-core p50 ≤ 50 ms benchmark before merging. This moves the A1 and
  A6 kill shots ahead of any counted evaluation. E002 and E003 are designed only after both models exist,
  with a written power analysis so the first evaluation decides rather than coming back INCONCLUSIVE;
  the design also includes sealed seeds, sanity checks for F1/F2 and secondary diagnostics for F3/F4.
  All three required experiments have design and run tasks. Decision records are founder-owned, so the
  reference-tool licensing decision is raised as a founder request.'
