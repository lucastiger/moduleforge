id: I0031
kind: decision
subject: '[O001] Confirm two amendments to D0003 for the L2 rebuild (iterative solve with a rigorous bound;
  FastHenry optional)'
summary: '(i) D0003 says the port impedance comes from a direct solve. C1 at level 4 and every E002 layout
  are too large for a dense LU on 17 GB. So n1 and n4a use GMRES with the a-posteriori bound |dZ| <= ||P(Mx)||^2/r_min,
  plus rounding and stated kernel-error bounds, wherever a dense LU does not fit. T0067 prototyped this.
  T0068 re-derived the bound and checked it against a dense LU: the true error was within the bound in
  9 of 9 cases. The registered contract allows iterative solves when solver_tol is a forward-error bound.
  (ii) D0003 keeps FastHenry ''where convenient''. This plan makes it optional and drops T0066''s binary_path/binary_sha256
  assertions from the layout path''s checks. Provenance becomes tool_version plus a sha256 of the solver
  sources, so the E002 burst VM does not need FastHenry provisioned.'
refs:
- O001
- T0069
options:
- Confirm (i) and (ii), and record them as D0004
- Confirm (i) only, and keep FastHenry binary provenance in the layout meta (re-add the assertions to
  n4a; the burst VM must then provision FastHenry)
- 'Reject (i): dense LU only. C1 level 4 and the E002 layouts then do not fit on this machine, so E001
  and E002 would need a large-memory host and probably re-registration'
recommendation: Confirm both and record D0004 before n1 starts.
status: approved
response: 'Founder (2026-10-04): confirm (i) and (ii); recorded as D0004 (project/decisions/D0004-l2-iterative-solve-fasthenry-optional.md)'
