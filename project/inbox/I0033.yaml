  level 4 (T0070''s check, for F1) and whether L2 can solve a layout at E002 scale within O001''s compute
  (n4b''s gate). That gate is the cheapest kill shot for E002''s feasibility, so n5 is not paid for until
  it passes. The new tasks total $22, about $37.50 with the already-queued T0070–T0072, which leaves room
  for reviews and a retry within the $95.42 that remains.'
