description: 'Create `src/moduleforge/canary.py` exposing `harmonic(n: int) -> float`, returning the n-th
  harmonic number H_n = sum_{k=1}^{n} 1/k in float64. Cite the definition in the docstring (e.g. Graham,
  Knuth, Patashnik, Concrete Mathematics §6.3). Keep it pure Python, with no numpy and no performance
  work. Use `math.fsum(1.0 / k for k in range(1, n + 1))` (correctly rounded summation) so the float error
  stays near 1e-16 for n up to 1e6. harmonic(1) must return exactly 1.0 and harmonic(2) exactly 1.5. Input
  validation: raise TypeError for non-int input, including bool; raise ValueError for n < 1.


  Add `tests/unit/test_canary.py` with these tests: (a) harmonic(1) == 1.0 and harmonic(2) == 1.5 exactly;
  (b) harmonic(10) matches float(sum(Fraction(1, k) for k in 1..10)) to relative error ≤ 1e-15; (c) for
  n in {1000, 10000, 100000, 1000000}, relative error against ln n + γ + 1/(2n) − 1/(12n²) + 1/(120n⁴)
  is ≤ 1e-12, with γ = 0.57721566490153286061 (OEIS A001620) and the expansion cited in a comment (Concrete
  Mathematics §9.6); (d) the return type is float and harmonic is strictly increasing on a few sample
  n; (e) ValueError for 0 and −1, TypeError for 2.5 and True.


  Do NOT modify `experiments/runners/e000_canary.py` or `experiments/specs/E000.yaml`. Both are founder-owned
  and outside your write scope. The runner imports `from moduleforge.canary import harmonic`, so keep
  that exact name and module path.'
