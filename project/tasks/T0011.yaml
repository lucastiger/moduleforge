description: 'Choose the L2 reference and pre-register its validation BEFORE the L2 adapter is built.
  Three deliverables, one purpose (the reference and its validation).


  (1) research/notes/o001-l2-reference.md — F6 audit, every fact cited with URL + access date, facts separated
  from inferences. Candidates: MIT FastHenry 3.0, FastFieldSolvers FastHenry2, Whiteley Research fasthenry
  (wrcad/xictools). For each give: exact license terms (quote them); whether it builds from source on
  macOS arm64 and Linux x86-64 with the system C compiler; support for finite meshed conductive planes,
  cross-section filament subdivision (skin/proximity effect), frequency sweeps; and its output format.
  Recommend one, pinned to an upstream commit/tarball with sha256. Describe the in-house FastHenry-class
  fallback and when it would be needed. mf-conventions: external tools run as separate executables for
  internal research only, never vendored, never GPL-imported. Also collect with citations the closed forms
  E001 uses (e.g. Ruehli 1972; Hoer & Love 1965; Grover 1946; Rosa 1908; image theory for a conductor
  over a perfectly conducting plane; the exact Bessel-function internal impedance of a round wire). If
  found, also collect published half-bridge loop-inductance anchors (PowerSynth TPEL 2019 2D half-bridge;
  Q3D vs double-pulse comparisons).


  (2) Contract section in the same note: the minimal primitive-level Python API that the E001 runner calls,
  in module `moduleforge.solvers.l2`, to be implemented by a later builder task. SI units, float64. Inputs:
  rectangular bars, round-wire polylines (diameter), finite rectangular conductive planes (extent, z,
  thickness, conductivity), a port definition, frequencies, and an integer `refinement` level. Output:
  port impedance per frequency (L = Im Z / ω). It must be implementable on the recommended tool.


  (3) experiments/drafts/E001.yaml and experiments/runners/e001_reference.py (mfos.evidence.ExperimentRun).
  Metric `max_rel_err_vs_analytic`: the maximum over cases and frequencies of |L2 − analytic| / analytic,
  using the converged L2 value. Pick canonical geometries whose closed form is exact for the modeled geometry
  to well under 2%, and state each case''s residual model error. Cover every L2 feature E002 relies on:
  rectangular bars (self and mutual partial inductance), a bond-wire-like round-wire chain, a conductor
  over a finite meshed plane compared with image theory in the δ ≪ t limit, and frequency dependence at
  5/20/80 MHz. Sanity checks must be able to fail. Include at least: closed-form implementations reproduce
  published tabulated or limit values; each L2 value changes < 1% under one refinement (l2_converged);
  reciprocity; length scaling (doubling all lengths doubles L). sealed_seed: false (deterministic cases).


  CLI: `--analytic-only` runs only the closed-form self-check without importing moduleforge.solvers (it
  must run today). `--smoke` runs at least one case of every geometry class at 20 MHz with run_dir=/tmp/e001-smoke.
  Full mode runs normally. Import moduleforge.solvers.l2 lazily, only on the L2 code path. Write nothing
  under src/.'
