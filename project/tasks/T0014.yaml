    for m in sys.modules), 'L1 must not import L2'"
  exists: null
  timeout_s: 120
- cmd: uv run python -c "import numpy as np; from moduleforge.generate.halfbridge import generate_layouts;
    from moduleforge.physics.peec import loop_inductance; l=generate_layouts(1, seed=7, dies_per_switch=3)[0];
    r=loop_inductance(l, freqs_hz=[5e6, 2e7, 8e7]); L=np.asarray(r.L_H); assert L.shape==(3,) and np.all(np.isfinite(L)),
    L; assert 1e-9 < L[1] < 1e-7, L; assert L[0] >= L[1]*(1-1e-6) and L[1] >= L[2]*(1-1e-6), L; print(L)"
  exists: null
  timeout_s: 600
- cmd: uv run python benchmarks/l1_timing.py
  exists: null
  timeout_s: 900
