id: T0015
objective: O001
title: Design E002 (L1 vs L2 ranking, sealed seed) and E003 (L1 single-core timing) + runners
type: design_experiment
agent: scientist
status: proposed
depends_on:
- T0012
- T0013
- T0014
description: 'Draft experiments/drafts/E002.yaml, experiments/drafts/E003.yaml, experiments/runners/e002_ranking.py
  and experiments/runners/e003_timing.py. Write research/notes/o001-e002-e003-design.md with the rationale
  and a power analysis.


  E002 (ranking):

  - sealed_seed: true. Layouts come from moduleforge.generate.halfbridge, stratified across all families
  and dies_per_switch 2–6.

  - Choose n by the written power analysis, so that A2/K1 (Spearman CI) and A4/K2 (MAPE CI) are decidable
  at plausible effect sizes and top-decile recall (A5/K3) has adequate resolution.

  - Compute L_loop with moduleforge.physics.peec (L1) and moduleforge.solvers.l2 (L2) at 20 MHz (primary)
  and at 5 and 80 MHz (secondary, F4).

  - ''Top'' means lowest L_loop. top_decile_recall is the share of L1''s top 10% that lies in L2''s top
  20%, with the rounding rule declared in advance.

  - Metrics: spearman_rho_Lloop (bootstrap 95% CI, fixed bootstrap seed); mape_Lloop (relative to L2,
  bootstrap CI); top_decile_recall (point). Secondary: Spearman at 5 and 80 MHz; Spearman correlation
  of the signed residual (L1−L2)/L2 with loop_area_proxy, conductive-plane distance and die count (F3
  detection).

  - Sanity checks that can fail: l2_converged (each L2 value changes < 1% under one refinement; if you
  check only a subset, justify it); sample_diverse (CV of L2 at 20 MHz ≥ 0.3); all_drc_valid; l2_reference_valid
  (re-solve at least one E001 canonical case in-run, within 2%); all_finite.

  - Declare exclusions in advance (default: none; a failed L2 solve makes the run invalid rather than
  being dropped).

  - Give an honest cpu_hours_est and timeout_min. Above 6 CPU-h, policy routes the run to burst compute;
  state what that requires for the L2 tool.


  E003 (timing):

  - Median wall time per L1 evaluation (Layout → L_loop at 20 MHz, including discretization) on one core,
  with threads pinned before any import.

  - Declare n_evals and the warm-up exclusion. Layouts come from the same generator.

  - Metric l1_eval_ms_p50 (point); report p90 as secondary.

  - Sanity checks: single_thread_enforced (verify the thread settings actually took effect) and results_finite.
  Record the CPU model.


  Both runners use mfos.evidence.ExperimentRun and support `--smoke` (≤ 6 layouts, an unsealed dev seed,
  run_dir /tmp/e002-smoke and /tmp/e003-smoke). Record the smoke outputs in the note as a pipeline check
  only. Do not change design parameters (n, strata, metrics, thresholds) because of L1-vs-L2 agreement
  seen in smoke. Do not write under src/.'
