  report:
    status: completed
    summary: 'Implemented the layer stack, layout IR, ConductorModel, DRC and the seeded half-bridge generator.
      scipy, shapely and jax are now in [project].dependencies (the physics group is removed) and uv.lock
      is updated. All DoD commands and `mfos gate --fast` exit 0. The work is committed as 9575da2.


      - **Geometry:** `LayerStack` is bottom-up with z = 0 at the baseplate bottom. DBC (Al2O3) and AMB
      (Si3N4) default stacks carry cited thicknesses, σ and k. `Layout` has `family`, `dies_per_switch`,
      a SHA-256 `fingerprint()` (coordinates rounded to 1 nm), and `to_conductors()`. The port definition
      (DC+ to DC−, PHASE open, switches on as ideal die shorts) is in the `Layout` docstring.

      - **Conductor model:** traces are decomposed into rectangles that preserve copper area. Wire segments,
      the backside-Cu plane (inset from the substrate edge), the baseplate plane (larger than the substrate),
      die shorts and the port are included.

      - **DRC:** `check(layout)` covers min trace width, min Cu–Cu spacing, Cu-to-edge margin, die-to-trace-edge
      margin, die–die spacing, wire length, wire pitch and wire landing on the correct net. It also checks
      die net, wire start on a die pad, and terminal on its Cu. Defaults are typical design-guide values.

      - **Generator:** `generate_layouts` cycles (family, dies 2–6) combinations in seeded permutations,
      with bounded reject-and-resample. Families are `side_by_side`, `interleaved` (C-shaped PHASE, DC+
      and DC− rows adjacent) and `u_shaped` (PHASE wraps DC+). Housing terminals are fixed. `loop_area_proxy`
      is included.

      - **Tests:** 30 tests under `tests/unit/{geometry,drc,generate}`. Each DRC rule is caught on a deliberately
      bad layout, and good layouts pass. The tests also cover rectangle decomposition and copper area,
      seeded determinism, family and die-count coverage, and terminal fixity. CV of `loop_area_proxy`
      ≥ 0.3 is asserted for seeds 12345, 1 and 2.'
