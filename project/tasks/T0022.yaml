description: 'Implement `moduleforge.solvers.l2` with two parts.


  (a) Exactly the primitive-level API specified in the contract section of research/notes/o001-l2-reference.md
  and called by experiments/runners/e001_reference.py. Do not edit the runner or the note. If the contract
  cannot be implemented, stop and report blocked; do not work around it.


  (b) `loop_inductance(layout, freqs_hz, refinement=0) -> LoopResult` with fields `L_H` and `R_ohm` (arrays
  aligned with freqs) and `meta` (tool version, discretization sizes, binary provenance as below), built
  on Layout.to_conductors().


  Binary (founder decision I0003, option b: the founder provisions the binary; this code never builds
  it). Use the tool recommended in the note (default FastHenry) as a separate executable. Never vendor
  or import its source, and do not edit scripts/provision_compute.sh. Implement `resolve_fasthenry() ->
  pathlib.Path`: use `MF_FASTHENRY_BIN` if it is set, otherwise the `fasthenry` executable found on PATH.
  Otherwise raise `FastHenryNotFoundError` (a RuntimeError subclass) whose message names both `MF_FASTHENRY_BIN`
  and `scripts/provision_compute.sh`. If MF_FASTHENRY_BIN is set but is not an executable file, raise
  the same error rather than silently falling through. No auto-build and no other fallback locations:
  no network, git, downloads or C compiler at run time. Every LoopResult.meta records `binary_path` (the
  absolute resolved path), `binary_sha256` (hex SHA-256 of the binary file''s bytes) and `tool_version`.
  Primitive-API results carry the same provenance if the contract gives them metadata. If no binary resolves
  in your environment, stop and report blocked; do not build FastHenry yourself.


  Units: write every FastHenry deck in meters (`.units m`), never `.units mm`. The provisioned build mis-scales
  inductance 1000x under `.units mm` (scripts/provision_compute.sh:52; docs/INFRASTRUCTURE.md, ''Legacy
  C''). Expose `fasthenry_deck(layout, freqs_hz, refinement=0) -> str`, which returns the exact deck text
  loop_inductance would run, so decks can be tested without the binary. benchmarks/infra/fh_gen.py is
  a working meters-based example of the deck syntax (gplane, nfloat, .equiv); read it but do not import
  it.


  Model the physics explicitly, with no image planes:

  - top-Cu traces with cross-section filament subdivision graded to resolve the skin depth at the highest
  requested frequency;

  - bond wires as segmented chains;

  - backside Cu and baseplate as finite meshed conductive planes at their true extent and thickness;

  - dies as ideal shorts;

  - the same port definition as to_conductors().


  `refinement` refines every discretization by a fixed, documented factor. Memoize solves on disk under
  the temp dir, keyed by geometry fingerprint, frequencies, refinement, tool version and binary sha256,
  so that a re-provisioned binary never reuses stale solves. Expose the tool version so runners can record
  it.


  Tests under tests/unit/solvers/:

  - input-deck generation without the binary, including that every deck declares `.units m` and none declares
  `.units mm`;

  - binary resolution with a fake executable and a monkeypatched environment: MF_FASTHENRY_BIN takes precedence
  over PATH, PATH is used otherwise, and the not-found error names scripts/provision_compute.sh;

  - parsing a stored sample output;

  - end-to-end small cases against closed forms;

  - reciprocity;

  - length scaling;

  - L_eff non-increasing with frequency;

  - a generated 2-die half-bridge within 1–100 nH.


  Do not modify pyproject.toml; n2 already moved the runtime dependencies.


  Founder requirement (revised 2026-10-04 after attempt 1; E001 registered, spec sha256:1c60eaaf..., runner
  frozen): report meta[''solver_tol''] as an honest bound on the TOTAL numerical error of the port impedance:
  the linear solve, FastHenry''s own kernel round-off for thin filaments (attempt 1 saw ~1e-6 relative
  jumps in A1 at level 4) and output rounding (6 digits). E001''s frozen refinement rule is safe at any
  noise floor and, with A1''s real sequence, converges at a floor >= 2e-6 (estimate 3.6e-6) but refuses
  at <= 2e-7: under-reporting the error is what made every case ''not converged''. The registered budget
  (solver_err_budget 1e-5, checked by l2_solver_tolerance) still applies. The earlier ''direct LU only,
  ratio <= 1e-4'' requirement is withdrawn: it is unattainable with FastHenry''s kernel precision and
  it forced a memory-bound dense LU that left C1 8.9 % off. Use FastHenry''s own iterative (multipole)
  solve where a dense LU does not fit (the C1 plane needs lateral cells much smaller than the 1 mm loop
  height), provided solver_tol bounds its error honestly. Implement exactly the contract in note sec.
  3 as registered; do not edit the runner or the spec. If C1 cannot reach the 2 % criterion within this
  machine''s 16 GB even so, stop and report blocked with the measured error vs plane mesh and memory:
  the founder will decide between a larger burst VM and the in-house fallback (note sec. 2).


  Founder decision D0003 (2026-10-04, after attempt 2 reported blocked): compute the partial-inductance
  and resistance matrices yourself with exact closed forms (Hoer & Love 1965 for rectangular bars, the
  exact filament mutual where filaments are used; ~1e-9 per entry), assemble and solve the mesh system
  directly, and report meta[''solver_tol''] as the rigorous bound that follows. FastHenry (D0002 pin)
  may still be used for geometry meshing and as a cross-check (meta[''fh_zc_rel_diff'']), but its kernel
  and solve no longer produce reported values. Mesh C1''s plane at 1 mm or finer (your attempt 2: 0.5-1
  mm cells converge, 15.423 -> 15.416 nH, and a direct solve at 1 mm fits in 16 GB). Keep one mesh per
  solve and the registered constant refinement ratio. Add unit tests that compare kernel entries against
  an independent high-precision quadrature (your benchmarks/infra/fh_kernel_accuracy.py reference) and
  run the E001 smoke DoD as written. See project/decisions/D0003-l2-exact-inhouse-kernel.md.'
