rationale: L2 is the reference for E001 (A1) and E002 (A2–A5, K1–K3). Its merge is gated on the pre-registered
  E001 smoke cases at the 2% A1 threshold, which catches F1 before any evaluation. Following the founder's
  I0003 option (b), it uses only the provisioned binary and records the binary's path and sha256, so every
  reference number traces back to the pinned build. Decks are written in meters because `.units mm` inflates
  inductance 1000x in this build, an F1 trap; checks in the definition of done guard against it.
