- cmd: uv run pytest -q tests/unit/solvers
  exists: null
  timeout_s: 1800
- cmd: uv run ruff check src/moduleforge/solvers tests/unit/solvers
  exists: null
  timeout_s: 120
- cmd: rm -rf /tmp/e001-smoke && uv run python experiments/runners/e001_reference.py --smoke && uv run
    python -c "import json; r=json.load(open('/tmp/e001-smoke/result.json')); assert r['status']=='complete',
    r['status']; assert r['sanity'] and all(s['passed'] for s in r['sanity']), r['sanity']; v=r['metrics']['max_rel_err_vs_analytic']['value'];
    assert v <= 0.02, v; print('E001 smoke max_rel_err', v)"
  exists: null
  timeout_s: 2400
- cmd: uv run python -c "import hashlib, os, numpy as np; from moduleforge.generate.halfbridge import
    generate_layouts; from moduleforge.solvers.l2 import loop_inductance; l=generate_layouts(1, seed=7,
    dies_per_switch=2)[0]; r=loop_inductance(l, freqs_hz=[5e6, 2e7, 8e7], refinement=0); L=np.asarray(r.L_H);
    assert L.shape==(3,) and np.all(np.isfinite(L)), L; assert 1e-9 < L[1] < 1e-7, L; assert L[0] >= L[1]*(1-1e-6)
    and L[1] >= L[2]*(1-1e-6), L; m=r.meta; p=m['binary_path']; assert os.path.isabs(p) and os.path.isfile(p),
    m; assert m['binary_sha256'] == hashlib.sha256(open(p, 'rb').read()).hexdigest(), m; assert m['tool_version'],
    m; print(L, p, m['binary_sha256'])"
  exists: null
  timeout_s: 1800
- cmd: 'uv run python -c "import os, subprocess, sys; env={k: v for k, v in os.environ.items() if k not
    in (''MF_FASTHENRY_BIN'',)}; env[''PATH'']=''/nonexistent''; p=subprocess.run([sys.executable, ''-c'',
    ''from moduleforge.solvers.l2 import resolve_fasthenry; resolve_fasthenry()''], env=env, capture_output=True,
    text=True); assert p.returncode > 0 and ''scripts/provision_compute.sh'' in p.stderr, (p.returncode,
    p.stderr[-800:]); print(''resolver fails clearly without a provisioned binary'')"'
  exists: null
  timeout_s: 120
- cmd: uv run python -c "from moduleforge.generate.halfbridge import generate_layouts; from moduleforge.solvers.l2
    import fasthenry_deck; d=fasthenry_deck(generate_layouts(1, seed=7, dies_per_switch=2)[0], freqs_hz=[2e7],
    refinement=0); u=[ln.split()[:2] for ln in d.lower().splitlines() if ln.strip().startswith('.units')];
    assert u and all(t == ['.units', 'm'] for t in u), u; print('deck units', u)"
  exists: null
  timeout_s: 300
- cmd: grep -rnE 'git clone|urlopen|urlretrieve|wget' src/moduleforge/solvers; test $? -eq 1
  exists: null
  timeout_s: 30
