description: 'Implement `moduleforge.physics.peec.loop_inductance(layout, freqs_hz) -> LoopResult`, with
  the same field names as L2: `L_H`, `R_ohm`, `meta`. The model must be exactly the hypothesis:


  - top-Cu traces as rectangular cells, with partial inductances from cited closed forms (e.g. Ruehli
  1972, Hoer & Love 1965);

  - skin-depth-corrected resistance (cite the formula);

  - bond wires as round filaments with Grover partial self and mutual inductances;

  - the stack''s conductive planes as image planes (state and justify in the docstring which plane(s)
  are imaged at each frequency, from skin depth vs layer thickness);

  - a quasi-static solve for the port impedance, with the same port definition as Layout.to_conductors().


  Independence: do not import moduleforge.solvers, do not call L2, and do not fit any correction factor
  to L2 outputs.


  Performance: vectorized kernels, with no Python loops over cells or filaments. Target a median ≤ 50
  ms per evaluation on one core with 6 dies per switch, where one evaluation is Layout → L_loop at 20
  MHz including discretization. If using JAX, enable x64 and avoid recompiling per layout (fixed shape
  buckets); numpy is equally acceptable.


  Tests under tests/unit/physics/peec/, per the mf-conventions physics testing standard:

  - analytic checks: bar self and mutual inductance vs Hoer–Love, round wire vs Grover, wire over a plane
  vs image theory;

  - limiting case: far-field mutual inductance tends to the filament formula;

  - the L matrix is symmetric positive definite;

  - length scaling;

  - R ∝ √f when δ ≪ t.


  Add benchmarks/l1_timing.py. It pins one thread (OMP/MKL/OpenBLAS/XLA env vars set before any import),
  generates ≥ 30 layouts with 6 dies per switch (fixed dev seed), excludes one declared warm-up call,
  prints p50/p90, and exits non-zero if p50 > 50 ms. Do not modify pyproject.toml.'
