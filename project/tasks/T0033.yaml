id: T0033
objective: O001
title: Layout fingerprint covers every to_conductors() input; die shorts span trace top to die top
type: implement
agent: builder
status: done
depends_on:
- T0021
description: 'Follow-up to the T0028 review of T0021 (project/reviews/T0021/T0028.json, notes "Fingerprint
  omits inputs that change to_conductors() output" and "DieShort.z_bottom is the bottom of the top-Cu
  layer"). It must merge before T0022 (the L2 adapter keys its on-disk solve cache on Layout.fingerprint())
  and T0023 (L1 PEEC consumes to_conductors()); both now depend on it.


  (1) Layout.fingerprint() must change whenever anything that to_conductors() or a later thermal model
  reads changes. In addition to what it hashes today, hash every LayerStack layer field (name, material,
  thickness, sigma, k), Layout.backside_inset, Layout.wire_sigma and every Die field, including attach_thickness.
  Keep it deterministic across processes and keep the 1 nm rounding for lengths. Hash conductivities with
  a relative rounding (for example 12 significant digits), not a 1 nm grid. Say in the docstring exactly
  what it covers. Fingerprints of existing layouts will change; nothing stored depends on them yet.


  (2) to_conductors(): each DieShort must span from the top surface of its trace (z_bottom = the top-Cu
  z_top, the die-attach interface) to the die top (z_top = die_z_range(d)[1]), i.e. attach + die thickness
  (about 0.23 mm), not from the bottom of the top Cu (0.53 mm today). State both node heights in the DieShort
  docstring.


  (3) Tests under tests/unit/geometry/: the fingerprint changes under each perturbation above and is identical
  for a regenerated layout; die-short z ranges for generated layouts.


  Change nothing outside src/moduleforge/geometry and tests/unit/geometry.'
