definition_of_done:
- cmd: uv run pytest -q tests/unit/geometry tests/unit/generate tests/unit/drc
  exists: null
  timeout_s: 900
- cmd: uv run ruff check src/moduleforge tests/unit
  exists: null
  timeout_s: 900
- cmd: "uv run python - <<'EOF'\nimport dataclasses\nfrom moduleforge.generate.halfbridge import generate_layouts\n\
    \ng = generate_layouts(1, seed=7, dies_per_switch=2)[0]\nf0 = g.fingerprint()\nassert generate_layouts(1,\
    \ seed=7, dies_per_switch=2)[0].fingerprint() == f0, \"fingerprint not deterministic\"\n\n\ndef with_layer(lay,\
    \ name, **kw):\n    layers = tuple(dataclasses.replace(la, **kw) if la.name == name else la for la\
    \ in lay.stack.layers)\n    return dataclasses.replace(lay, stack=dataclasses.replace(lay.stack, layers=layers))\n\
    \n\nd0 = g.dies[0]\nvariants = {\n    \"top_cu sigma\": with_layer(g, \"top_cu\", sigma=5.0e7),\n\
    \    \"backside_cu sigma\": with_layer(g, \"backside_cu\", sigma=5.0e7),\n    \"baseplate sigma\"\
    : with_layer(g, \"baseplate\", sigma=5.0e7),\n    \"ceramic k\": with_layer(g, \"ceramic\", k=90.0),\n\
    \    \"backside_inset\": dataclasses.replace(g, backside_inset=g.backside_inset + 0.5e-3),\n    \"\
    wire_sigma\": dataclasses.replace(g, wire_sigma=g.wire_sigma * 0.9),\n    \"die attach_thickness\"\
    : dataclasses.replace(\n        g, dies=[dataclasses.replace(d0, attach_thickness=d0.attach_thickness\
    \ + 20e-6), *g.dies[1:]]),\n}\nignored = [k for k, v in variants.items() if v.fingerprint() == f0]\n\
    assert not ignored, f\"fingerprint ignores: {ignored}\"\nprint(f\"fingerprint covers all {len(variants)}\
    \ perturbations\")\nEOF"
  exists: null
  timeout_s: 900
- cmd: "uv run python - <<'EOF'\nfrom moduleforge.generate.halfbridge import generate_layouts\n\nfor lay\
    \ in generate_layouts(6, seed=11):\n    z1 = lay.top_cu_z()[1]\n    for s, d in zip(lay.to_conductors().shorts,\
    \ lay.dies, strict=True):\n        zb, zt = lay.die_z_range(d)\n        assert abs(s.z_bottom - z1)\
    \ < 1e-12, (\"die short must start at the trace top\", s.z_bottom, z1)\n        assert abs(s.z_top\
    \ - zt) < 1e-12, (\"die short must end at the die top\", s.z_top, zt)\n        assert abs((s.z_top\
    \ - s.z_bottom) - (d.attach_thickness + d.thickness)) < 1e-12\nprint(\"every die short spans trace\
    \ top -> die top (attach + die)\")\nEOF"
  exists: null
  timeout_s: 900
- cmd: uv run python -c "from moduleforge.generate.halfbridge import generate_layouts; from moduleforge.drc
    import check; a=generate_layouts(60, seed=12345); b=generate_layouts(60, seed=12345); assert len(a)==60;
    bad=[l.fingerprint() for l in a if check(l)]; assert not bad, bad; assert [l.fingerprint() for l in
    a]==[l.fingerprint() for l in b]; assert len({l.family for l in a})>=3; assert {l.dies_per_switch
    for l in a}=={2,3,4,5,6}; c=a[0].to_conductors(); print('ok', len(a))"
  exists: null
  timeout_s: 900
