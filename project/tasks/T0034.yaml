id: T0034
objective: O001
title: 'DRC hardening from the T0028 review: connectivity, keep-outs, diameter-aware pitch, width boundary,
  full rule coverage'
type: implement
agent: builder
status: review
depends_on:
- T0021
description: 'Follow-up to the T0028 review of T0021 (project/reviews/T0021/T0028.json). check() must
  reject the adversarial layouts the critic built, while generated layouts stay DRC-clean. The rule names
  below are part of the contract: the definition of done refers to them.


  (1) Connectivity. Work out each wire''s expected landing net from the die whose source pad holds its
  start (HS source -> PHASE, LS source -> DC-). Emit `wire_net` when the net of the copper under the landing
  point, or the wire''s own `net` label, differs from that. Emit `die_unbonded` for a die with no wire
  starting on its source pad. Emit `missing_switch` when the layout has no HS die or no LS die (this covers
  an empty layout).


  (2) Keep-outs. Emit `die_on_terminal` when a die footprint overlaps a terminal pad. Emit `wire_landing_keepout`
  when a landing point lies within wire_landing_margin of a die footprint or terminal pad.


  (3) Wire pitch and diameter. `wire_pitch` requires centreline distance >= max(min_wire_pitch, wire_pitch_diameters
  * max(d_i, d_j)), with a new DesignRules field wire_pitch_diameters = 2.0 (the module docstring''s ~2
  wire diameters). Emit `wire_diameter` for diameters outside a new [min_wire_diameter, max_wire_diameter]
  range; use placeholder values for heavy Al wire and cite the source, as the module docstring does for
  the others.


  (4) Width boundary. min_trace_width must treat the boundary like min_spacing: a feature exactly min_trace_width
  wide passes and one 0.001 mm narrower fails. Use a tolerance well above GEOS''s precision (for example
  1e-7 m) instead of 1 nm.


  (5) Tests. Every rule check() emits needs a test that fails when that rule is removed (the definition
  of done checks this by mutation). Add bad-layout tests for wire_start and terminal_off_trace, which
  have none today. Replace test_loop_area_proxy_known_value, which recomputes the implementation''s own
  formula, with a hand-built case whose area is known in closed form.


  If a generated layout violates a new rule, fix the generator (src/moduleforge/generate/halfbridge.py)
  rather than relaxing the rule, and say so in your report. Do not change the Layout IR (src/moduleforge/geometry).'
