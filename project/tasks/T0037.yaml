  failure_output: '- [major] The ''die pad names'' pin tests the number of pads, not their names: a fingerprint
    that ignores pad names passes every geometry test: The pin adds a third pad (`kelvin`). Any fingerprint
    that hashes the pad rectangles as a list catches that change, whether or not it hashes the names.
    Nothing in the suite renames or swaps pads. A fingerprint that replaces pad names with ordinal labels
    (sorted by rectangle) therefore survives all of tests/unit/geometry. The completeness test still reports
    pad names as pinned, so it gives false assurance. This is inside the tests'' own stated scope (''a
    fingerprint that ignored the field ... fails the pin''). It also matters physically: `to_conductors()`
    reads `d.pads["source"]`, so swapping the source and gate rectangles changes the conductor model,
    yet that swap collides under the name-blind fingerprint. The production fingerprint itself is correct;
    it hashes the sorted (name, rectangle) pairs.

    - [minor] The pins do not tie each trace''s net label to its polygon: a fingerprint that sorts trace
    nets separately from the polygons survives: The ''trace net'' pin changes one trace''s net at a time.
    That changes the multiset of nets, so a fingerprint that hashes the sorted net labels apart from the
    polygons also sees it. Swapping the nets of two traces does change the conductor model (RectCell net
    labels) and would collide under such a fingerprint. This is outside the tests'' stated ''ignored or
    normalised to a constant'' scope. It is still a gap under ''pin every hashed input'', and the same
    pattern very likely applies to wire nets (I did not run that case).

    - [minor] The new docstring overstates quantization: sub-0.5 nm changes are not always absorbed: The
    docstring says ''sub-0.5 nm changes are absorbed''. Rounding each field to its own 1 nm grid only
    absorbs changes that do not cross a rounding tie. In addition, `_ring_ints` runs `shapely.normalize`
    before rounding, so moving one polygon vertex by less than 1 nm can change which vertex the ring starts
    at, and with it the hash. The quantum tests hide both effects: they snap to the grid first and shift
    all coordinates uniformly. The digest errs toward reporting a change, never toward a collision, but
    the statement itself is false.

    - [note] The docstring says the hash covers ''the labels'', but one label, Terminal.net, is unhashed:
    Terminal.net is explicitly listed under ''Not covered'', and grep shows that nothing in src/ (DRC
    included) reads it; DRC and to_conductors use the dict key. So the behaviour matches the docstring,
    but the headline ''plus the labels'' is slightly loose.'
