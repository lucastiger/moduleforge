description: 'Follow-up to the T0035 review of T0033 (project/reviews/T0033/T0035.json).


  (1) Hash LayerStack.kind in Layout.fingerprint(), so that the fingerprint really covers every to_conductors()
  input (to_conductors() returns the whole LayerStack, label included).

  (2) Docstring: drop the claim that the fingerprint covers "a thermal model" (none exists yet); state
  exactly what it covers and that lengths are quantized to 1 nm per field and conductivities to 12 significant
  digits.

  (3) Tests under tests/unit/geometry/ must pin EVERY hashed field of the Layout IR (attempt 1 was rejected
  by review T0039 for pinning only the 23 listed below: die w/h, terminal cy/w/h, family, dies_per_switch,
  the gate pad, solder sigma and non-ceramic k were unpinned). The definition of done now blinds the fingerprint
  to each of all 45 hashed fields in turn; only BondWire.loop_height and Terminal.net are exempt, and
  the docstring''s ''Not covered'' list must name exactly those two. Also make the quantization test two-sided:
  0.01 nm is ignored, 2 nm is seen. Original wording: tests under tests/unit/geometry/ must pin every
  hashed input: for each one, a test that changes it and asserts the fingerprint changes. The definition
  of done checks this by mutation: for each input it replaces Layout.fingerprint with a version blind
  to that input and requires an assertion failure in tests/unit/geometry. The inputs are: wire points,
  diameter and net; die source pad, position and attach_thickness; terminal centres; substrate and baseplate
  outlines; trace polygons and nets; backside_inset; wire_sigma; LayerStack.kind; every layer thickness;
  baseplate, backside_cu and top_cu sigma; ceramic k.


  Change nothing outside src/moduleforge/geometry and tests/unit/geometry.'
