id: T0038
objective: O001
title: 'DRC: per-net copper connectivity, neck detection, terminal clearance, wire start margin, no KeyError
  (T0036 review)'
type: implement
agent: builder
status: done
depends_on:
- T0033
- T0034
description: 'Follow-up to the T0036 review of T0034 (project/reviews/T0034/T0036.json). The founder session
  confirmed the major finding (DC+ split into two copper islands passes DRC) and the KeyError by running
  them. The rule names below are part of the contract: the definition of done refers to them.


  (1) Copper connectivity. Emit `net_split` when a net''s copper (the union of its traces) is not one
  connected island. Generated layouts use one island per net; a net split into islands leaves its terminal,
  dies and landings unconnected, so the commutation loop the PEEC port measures can be open.

  (2) Necks. min_trace_width must also catch a narrow neck joining two wide regions, e.g. two 5 mm blocks
  sharing a 0.1 mm edge or overlapping in a 0.1 x 0.1 mm corner, which the opening test misses (for example:
  flag a trace whose erosion by half the minimum width splits into more pieces than the trace itself has).
  Keep the existing boundary behaviour: 1.000 mm passes, 0.9997 mm fails.

  (3) Same-net die-to-terminal clearance. `die_on_terminal` must also fire when a die is closer than a
  new DesignRules field die_terminal_clearance (default: die_edge_margin, 1 mm) to any terminal pad, not
  only when it overlaps one.

  (4) Wire start margin. `wire_start` must fire when a wire starts closer than a new DesignRules field
  wire_start_margin to the edge of its source pad (placeholder value with a cited rationale, as the module
  docstring does for the others; e.g. half the wire diameter), not only when it starts outside the pad.

  (5) A die without a ''source'' pad must not crash check(): emit `die_no_source_pad` (and let the other
  wire rules treat the die as having no pad).

  (6) Tests: each of these with a bad-layout test in tests/unit/drc, and a test pinning the 0.9997 mm
  dead band. The rule-removal check in the definition of done now counts a rule as covered only by an
  AssertionError in some test, not by a crash, collection or fixture error.


  If a generated layout violates a new rule, fix the generator (src/moduleforge/generate/halfbridge.py)
  rather than relaxing the rule, and say so in your report. Do not change the Layout IR (src/moduleforge/geometry).'
