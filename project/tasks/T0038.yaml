- cmd: "uv run python - <<'EOF'\nimport dataclasses\nfrom shapely.geometry import box\nfrom moduleforge.drc\
    \ import check\nfrom moduleforge.generate.halfbridge import generate_layouts\nfrom moduleforge.geometry\
    \ import Trace\nfrom moduleforge.geometry.units import mm_to_m as mm\n\n\ndef rules(lay):\n    try:\n\
    \        return {v.rule for v in check(lay)}\n    except Exception as e:  # a crash is a miss, not\
    \ a pass\n        return {f\"CRASH {type(e).__name__}: {e}\"}\n\n\ndef split(lay, net):\n    t = next(x\
    \ for x in lay.traces if x.net == net)\n    tm = lay.terminals[net]\n    x0, y0, x1, y1 = t.polygon.bounds\n\
    \    cut = tm.cx - tm.w / 2 - mm(2.0)\n    left = t.polygon.intersection(box(x0, y0, cut - mm(0.5),\
    \ y1))\n    right = t.polygon.intersection(box(cut + mm(0.5), y0, x1, y1))\n    return dataclasses.replace(lay,\
    \ traces=[x for x in lay.traces if x is not t] + [Trace(net, left), Trace(net, right)])\n\n\ns = generate_layouts(3,\
    \ seed=3, family=\"side_by_side\", dies_per_switch=3)[0]\ng = generate_layouts(1, seed=1, family=\"\
    interleaved\", dies_per_switch=3)[0]\nassert check(s) == [] and check(g) == []\ncases = {}\nfor lay,\
    \ fam in ((s, \"side_by_side\"), (g, \"interleaved\")):\n    for net in (\"DC+\", \"DC-\"):\n    \
    \    cases[f\"{fam}: {net} split into two copper islands -> net_split\"] = \"net_split\" in rules(split(lay,\
    \ net))\nfor name, shape in ((\"0.1 mm edge neck\", box(0, 0, mm(5), mm(5)).union(box(mm(5), mm(4.9),\
    \ mm(10), mm(9.9)))),\n                    (\"0.1 mm corner neck\", box(0, 0, mm(5), mm(5)).union(box(mm(4.9),\
    \ mm(4.9), mm(9.9), mm(9.9))))):\n    cases[f\"{name} between two 5 mm blocks -> min_trace_width\"\
    ] = \"min_trace_width\" in rules(\n        dataclasses.replace(s, traces=[*s.traces, Trace(\"DC-\"\
    , shape)]))\nt = next(t for t in s.traces if t.net == \"DC-\")\nminx, _, _, maxy = t.polygon.bounds\n\
    \n\ndef stub(width):\n    poly = t.polygon.union(box(minx + mm(10), maxy, minx + mm(10) + width, maxy\
    \ + mm(6)))\n    return rules(dataclasses.replace(s, traces=[Trace(\"DC-\", poly) if x is t else x\
    \ for x in s.traces]))\n\n\ncases[\"1.0000 mm stub passes min_trace_width\"] = \"min_trace_width\"\
    \ not in stub(mm(1.0))\ncases[\"0.9997 mm stub fails min_trace_width\"] = \"min_trace_width\" in stub(mm(0.9997))\n\
    hs_g = next(d for d in g.dies if d.switch == \"HS\")\ntm = g.terminals[\"DC+\"]\nfor gap in (0.0,\
    \ 0.5):\n    cx = tm.cx - (tm.w / 2 + hs_g.w / 2 + mm(gap))\n    near = dataclasses.replace(g, dies=[dataclasses.replace(hs_g,\
    \ cx=cx, cy=tm.cy) if d is hs_g else d for d in g.dies])\n    cases[f\"HS die {gap} mm from its own\
    \ DC+ pad -> die_on_terminal\"] = \"die_on_terminal\" in rules(near)\nhs = next(d for d in s.dies\
    \ if d.switch == \"HS\")\nx0, y0, x1, y1 = hs.pads[\"source\"]\nw0 = next(w for w in s.wires if x0\
    \ - 1e-9 <= w.points[0, 0] <= x1 + 1e-9 and y0 - 1e-9 <= w.points[0, 1] <= y1 + 1e-9)\np = w0.points.copy()\n\
    p[0, 0] = x0\ncases[\"wire starting exactly on the source-pad edge -> wire_start\"] = \"wire_start\"\
    \ in rules(\n    dataclasses.replace(s, wires=[dataclasses.replace(w0, points=p) if w is w0 else w\
    \ for w in s.wires]))\nnopad = dataclasses.replace(s, dies=[dataclasses.replace(hs, pads={k: v for\
    \ k, v in hs.pads.items() if k != \"source\"})\n                                     if d is hs else\
    \ d for d in s.dies])\ncases[\"die without a source pad -> die_no_source_pad, no crash\"] = \"die_no_source_pad\"\
    \ in rules(nopad)\nmissed = [k for k, ok in cases.items() if not ok]\nassert not missed, \"not handled:\
    \ \" + \"; \".join(missed)\nprint(f\"all {len(cases)} T0036 cases handled\")\nEOF"
  exists: null
  timeout_s: 900
- cmd: "uv run python - <<'EOF'\nimport dataclasses\nimport numpy as np\nfrom shapely.geometry import\
    \ box\nfrom moduleforge.drc import check\nfrom moduleforge.generate.halfbridge import generate_layouts,\
    \ loop_area_proxy\nfrom moduleforge.geometry.layout import BondWire, Terminal, Trace, arc_wire\n\n\
    \ndef rules(lay):\n    return {v.rule for v in check(lay)}\n\n\ndef starts_on(w, d):\n    x0, y0,\
    \ x1, y1 = d.pads[\"source\"]\n    return x0 - 1e-9 <= w.points[0, 0] <= x1 + 1e-9 and y0 - 1e-9 <=\
    \ w.points[0, 1] <= y1 + 1e-9\n\n\ng = generate_layouts(1, seed=1, family=\"interleaved\", dies_per_switch=3)[0]\n\
    assert check(g) == [], check(g)\nhs = next(d for d in g.dies if d.switch == \"HS\")\nls = next(d for\
    \ d in g.dies if d.switch == \"LS\")\nhs_wires = [w for w in g.wires if starts_on(w, hs)]\nw0 = hs_wires[0]\n\
    cases = {}\ndcm = next(t for t in g.traces if t.net == \"DC-\").polygon.representative_point()\nshorted\
    \ = [arc_wire(w.points[0, :2], (dcm.x, dcm.y), w.points[0, 2], w.points[-1, 2], w.loop_height, w.diameter,\
    \ \"DC-\")\n           if any(w is h for h in hs_wires) else w for w in g.wires]\ncases[\"HS die bonded\
    \ to DC- (DC-link short) -> wire_net\"] = \"wire_net\" in rules(dataclasses.replace(g, wires=shorted))\n\
    cases[\"empty layout -> missing_switch\"] = \"missing_switch\" in rules(dataclasses.replace(g, wires=[],\
    \ dies=[]))\ncases[\"HS die without wires -> die_unbonded\"] = \"die_unbonded\" in rules(\n    dataclasses.replace(g,\
    \ wires=[w for w in g.wires if not any(w is h for h in hs_wires)]))\ntm = g.terminals[\"DC+\"]\ncases[\"\
    die on the DC+ terminal pad -> die_on_terminal\"] = \"die_on_terminal\" in rules(\n    dataclasses.replace(g,\
    \ dies=[*g.dies, dataclasses.replace(hs, cx=tm.cx, cy=tm.cy)]))\nunder = arc_wire(w0.points[0, :2],\
    \ (ls.cx, ls.cy), w0.points[0, 2], w0.points[-1, 2], w0.loop_height, w0.diameter,\n              \
    \   \"PHASE\")\ncases[\"wire landing under an LS die -> wire_landing_keepout\"] = \"wire_landing_keepout\"\
    \ in rules(\n    dataclasses.replace(g, wires=[under if w is w0 else w for w in g.wires]))\na = BondWire(w0.points,\
    \ 0.6e-3, w0.loop_height, w0.net)\nb = BondWire(w0.points + np.array([0.6e-3, 0.0, 0.0]), 0.6e-3,\
    \ w0.loop_height, w0.net)\ncases[\"touching 0.6 mm wires at 0.6 mm pitch -> wire_pitch\"] = \"wire_pitch\"\
    \ in rules(dataclasses.replace(g, wires=[a, b]))\nfor dia in (0.0, -1e-3):\n    cases[f\"diameter\
    \ {dia} m -> wire_diameter\"] = \"wire_diameter\" in rules(\n        dataclasses.replace(g, wires=[BondWire(w.points,\
    \ dia, w.loop_height, w.net) for w in g.wires]))\ns = generate_layouts(3, seed=3, family=\"side_by_side\"\
    , dies_per_switch=3)[0]\nt = next(t for t in s.traces if t.net == \"DC-\")\nminx, _, _, maxy = t.polygon.bounds\n\
    \n\ndef with_stub(width):\n    poly = t.polygon.union(box(minx + 0.010, maxy, minx + 0.010 + width,\
    \ maxy + 0.006))\n    return rules(dataclasses.replace(s, traces=[Trace(\"DC-\", poly) if x is t else\
    \ x for x in s.traces]))\n\n\ncases[\"1.000 mm feature passes min_trace_width\"] = \"min_trace_width\"\
    \ not in with_stub(1.0e-3)\ncases[\"0.999 mm feature fails min_trace_width\"] = \"min_trace_width\"\
    \ in with_stub(0.999e-3)\nhsd = [dataclasses.replace(d, cx=4e-3, cy=0.0) for d in s.dies if d.switch\
    \ == \"HS\"]\nlsd = [dataclasses.replace(d, cx=4e-3, cy=3e-3) for d in s.dies if d.switch == \"LS\"\
    ]\nterms = {**s.terminals, \"DC+\": Terminal(\"DC+\", 0.0, 0.0, 1e-3, 1e-3), \"DC-\": Terminal(\"\
    DC-\", 0.0, 3e-3, 1e-3, 1e-3)}\ncases[\"loop_area_proxy of a 4 x 3 mm rectangle = 12 mm^2\"] = abs(\n\
    \    loop_area_proxy(dataclasses.replace(s, dies=hsd + lsd, terminals=terms)) - 12e-6) < 1e-15\nmissed\
    \ = [k for k, ok in cases.items() if not ok]\nassert not missed, \"not caught: \" + \"; \".join(missed)\n\
    print(f\"all {len(cases)} T0028 adversarial cases handled\")\nEOF"
