- cmd: "uv run python - <<'EOF'\nimport subprocess\nimport sys\nimport tempfile\nimport xml.etree.ElementTree\
    \ as ET\nfrom pathlib import Path\n\ndef killed(xml):\n    \"\"\"A kill is an assertion failure in\
    \ some test, not a crash, collection or fixture error.\"\"\"\n    return xml.exists() and any(\"AssertionError\"\
    \ in (f.text or \"\") + (f.get(\"message\") or \"\")\n                                for f in ET.parse(xml).iter(\"\
    failure\"))\n\n\nRULES = [\"min_trace_width\", \"min_spacing\", \"edge_margin\", \"die_off_trace\"\
    , \"die_wrong_net\", \"die_edge_margin\",\n         \"die_spacing\", \"die_on_terminal\", \"die_unbonded\"\
    , \"die_no_source_pad\", \"missing_switch\", \"net_split\",\n         \"wire_length\", \"wire_landing\"\
    , \"wire_landing_keepout\", \"wire_start\", \"wire_net\", \"wire_pitch\",\n         \"wire_diameter\"\
    , \"terminal_off_trace\"]\nPROG = (\"import moduleforge.drc as d, moduleforge.drc.rules as r; o =\
    \ r.check; \"\n        \"d.check = r.check = lambda *a, **k: [v for v in o(*a, **k) if v.rule != {rule!r}];\
    \ \"\n        \"import pytest, sys; sys.exit(pytest.main(['-q', '-p', 'no:cacheprovider', '--junitxml={xml}',\
    \ \"\n        \"'tests/unit/drc']))\")\nsurvivors = []\nwith tempfile.TemporaryDirectory() as tmp:\n\
    \    for rule in RULES:\n        xml = Path(tmp) / \"r.xml\"\n        subprocess.run([sys.executable,\
    \ \"-c\", PROG.format(rule=rule, xml=xml)], capture_output=True)\n        if not killed(xml):\n  \
    \          survivors.append(rule)\nassert not survivors, f\"no test in tests/unit/drc fails by assertion\
    \ when these rules are removed: {survivors}\"\nprint(f\"all {len(RULES)} rules are covered by an assertion\
    \ failure\")\nEOF"
  exists: null
