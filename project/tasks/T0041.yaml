    error is 1.1e-9 at 100 Hz and 1.'
  report:
    summary: 'E001''s design is fixed, but one definition-of-done command still fails: `b1_exact_limits.py`
      exits 1. The defect is in that founder-owned check, not the runner, and the fix is two arguments.
      I left the runner''s bound alone rather than inflating it to pass.


      **Why the B1 check fails.** Both of its `integrate.quad` calls use scipy''s default absolute tolerance,
      epsabs = 1.49e-8. In SI units the thin-skin integral is only about 2.5e-8, so quad stops after 63
      evaluations and returns a value 1.09e-4 too low (7.822823 nH; the correct value is 7.823677 nH).
      Three methods agree on the correct value: tight quadrature, subtracting the log singularity analytically,
      and the moment series. A copy of the script with only `epsabs=0, epsrel=1e-12` added passes: the
      runner''s error is 1.1e-9 at 100 Hz and 1.3e-5 at 10 GHz, against bounds of 5.4e-5 and 5.75e-5.
      The 1.3e-5 is the expected finite-skin-depth term (-0.104 pH predicted, -0.103 pH observed). Passing
      the unmodified script would need a B1 bound of at least 9.6e-5, which no derived term supports.
      Registration would freeze that bound into E001.


      **Defect neither review caught.** mfos loads specs with PyYAML (YAML 1.1), which reads `5.0e6`,
      `2.0e7`, `8.0e7`, `5.8e7` and `3.77e7` as strings. With a stand-in L2 solver, the registered full
      run crashed with status `error`, and `mfos register` would have frozen the strings into the spec.
      The draft now writes `5.0e+6` etc. The runner''s new `checked_config` rejects any config value whose
      type differs from `DEFAULT_CFG`.


      **The five packet items:**

      - **Wire model error (1):** handled. The round-wire self term now averages over the exact Bessel
      current profile, covering the whole uniform-to-surface transition. A proximity dipole correction
      is added. Every wire class has a derived bound: B1 5.4–5.7e-5, B2 ≤ 9.1e-4, B3 ≤ 1.28e-3, B4 ≤ 9.3e-4,
      C0 ≤ 1.55e-4, C1 ≤ 1.55e-3, all within the 2e-3 target. The note (§4.3) gives each derivation and
      a term-by-term table.

      - **Convergence (2):** handled. `remaining_discretization_error` uses the observed ratio from at
      least 3 levels with Roache''s 1.25 factor, and states the 2-level fallback. I added a guard: a level
      that happens not to change a value (1.00, 1.02, 1.02) now gives 1.25 % instead of 0, so it can''t
      be declared converged.

      - **L2 contract (3):** handled. One mesh per refinement level for all frequencies of a call, and
      `meta[''solver_tol'']` is required and checked. I kept f_lf = 100 Hz and tightened the tolerance
      requirement instead; raising f_lf would break the bars'' DC closed forms.

      - **Coverage (4):** handled. `--smoke` covers all 7 classes. The three new self-checks are in place,
      and each fails under at least one source mutation (8 mutations in all; table in §4.5).

      - **Hygiene (5):** handled. Draft keys and values equal `DEFAULT_CFG`, every key is read, the metric
      interval is recorded at level 1.0, and the 1992 date was confirmed first-hand.


      I also tightened the Bessel/reaction self-check. Its old 7.5e-5 result against a 1e-4 tolerance
      was a quadrature artifact. In exact 1-D form it agrees to 5e-12, with tolerance 1e-6.


      All other definition-of-done commands exit 0: exp check, ruff, `--analytic-only`, `convergence_estimator.py`,
      `design_contract.py`, `mfos gate --fast`. Work is committed as 10c5966; the tree is clean.'
