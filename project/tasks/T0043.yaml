id: T0043
objective: O001
title: 'DRC: loop-closing necks, unknown die.switch, diameter-aware wire-start margin (T0040 review)'
type: implement
agent: builder
status: todo
depends_on:
- T0038
description: 'Follow-up to the T0040 review of T0038 (project/reviews/T0038/T0040.json). Low priority:
  nothing in O001 depends on it (generated layouts are valid by construction), but check() is the guard
  any later layout mutation or optimisation will rely on. Rule names are part of the contract.


  (1) Loop-closing necks. min_trace_width must also flag a narrow neck that closes a copper loop (a trace
  with a hole): eroding by half the minimum width turns the ring into a C, so the piece count stays 1
  and the check misses it; the hole count drops. Compare topology (pieces and holes) before and after
  erosion, or equivalent.

  (2) Unknown die.switch. A die whose switch is not ''HS'' or ''LS'' must not crash check(): emit `die_bad_switch`
  and skip the switch-dependent rules for that die.

  (3) Wire-start margin. wire_start must require the start to lie at least max(wire_start_margin, diameter
  / 2) inside the source pad (the rule''s own rationale: the bond foot must not overhang the pad), so
  it scales with the wire.

  (4) Tests in tests/unit/drc for each, including one that removing `die_bad_switch` from check() fails
  by assertion.


  If a generated layout violates a changed rule, fix the generator rather than relaxing the rule, and
  say so. Do not change the Layout IR. The definition of done runs project/dod/drc-t0040/*.py (founder-authored).'
