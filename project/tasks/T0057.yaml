    alternative_explanations:
    - explanation: The rule's validity rests on the assumption that the leading error order is at least
        1. If a real L2 quantity converges more slowly (a strong singularity, or erratic staircase round-wire
        meshes), the rule can still underestimate. In the sweep, a hidden order-0.5 term gave up to 2.6x
        without noise and 6.9x with noise.
      how_to_discriminate: When the L2 builder (T0022) runs, look at its observed-order sequences on B1-C1
        at 5-7 levels before E001 is run. Observed orders below 1 that stay steady across levels would
        refute the assumption, and E001 would then need a new experiment id with order_min lowered and
        refinement_max raised.
    - explanation: The conservative rule may refuse to certify a correct L2 within refinement_max = 5.
        This happens if L2 is pre-asymptotic at levels 1-5, superconverges above order 2, or converges
        at order 1 from a large initial error (the order-1 stand-in shows this). The outcome would be
        an INVALID run rather than a false PASS, but it costs a redesign.
      how_to_discriminate: Run the stand-in-style check on the real adapter's first 5 levels for every
        case and see whether `l2_converged` passes. If the observed orders are steady at 2 or above, or
        at 1 with large changes, the feasibility risk is real.
    discriminating_tests:
    - 'uv run python research/scripts/e001_refinement_rule_sweep.py: reproduces the validation table.
      Expect 0 false convergences in runner mode for leading orders 1-2, with and without noise.'
    - 'Plug the T0041 version of remaining_discretization_error into refinement_rule_selfcheck: expect
      8 false convergences, so the sanity check fails.'
    - 'Remove the wire_self_correction term in the tube-PEEC entries: the new ''(r/l) x uncorrected''
      entries fail at every length, including 1.5 mm.'
    - 'Run a stand-in L2 that refines one mesh_params entry additively, or reports a different mesh_hash
      per frequency: l2_constant_refinement_ratio or l2_one_mesh_per_solve fails.'
    - 'Run a stand-in L2 whose mesh_params do not double under the 2x similarity: length_scaling fails
      (value inf).'
    recommended_actions:
