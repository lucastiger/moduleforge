  report:
    summary: 'I fixed E001''s draft before registration and committed it as 1610141. The fixes cover all
      five review items, and acceptance criteria are unchanged. All 8 definition-of-done commands and
      `mfos gate --fast` exit 0 when run from this worktree: `mfos exp check E001`, `ruff`, `--analytic-only`,
      and the five DoD scripts `b1_exact_limits`, `convergence_estimator`, `design_contract`, `b3_mutual_exact`
      and `estimator_adversarial`.


      (1) **Refinement rule.** `remaining_discretization_error` now gives a finite estimate only when
      all three conditions hold over the last three changes. Otherwise it returns inf (not converged).

      - No sign reversal above the solver noise floor.

      - Both observed orders, solved on the realized mesh sizes, are at most `order_max` = 2 (the formal
      order). A faster apparent order means pre-asymptotic cancellation.

      - The two orders are steady: the contraction ratios agree within a factor of 1.1.


      When the checks pass, the estimate is the Richardson tail × 1.25, or × 3 if the observed order is
      below `order_min` = 1. On the founder''s adversarial test it gives 0 false convergences out of 1395
      (previously 86). Clean geometric cases come out at 1.25× the true error. In my own sweep (seed 99,
      ratio jitter, solver noise) it gave 0 false convergences in 10,852 declared-converged sequences
      inside the stated assumption, with coverage ≥ 0.9989.


      (2) **Interval level.** The unsupported 0.95 is withdrawn. A new physics-independent sanity check,
      `refinement_rule_validated`, runs a frozen synthetic sweep of 4200 sequences in every mode. It fails
      on any false convergence, on coverage below 0.95, or if clean geometric cases fall outside 1–3×
      the true error. The coverage it measures (0.98 at design time) is recorded as `level`, and the YAML
      and the note say exactly what that number means and does not mean. The old rule fails this check.


      (3) **Verifiable contract.** The adapter must now report `meta[''mesh_params'']`: the size in metres
      of every refined parameter. The ratio check runs per parameter and per step, and `length_scaling`
      checks these sizes against geometry (exactly doubled, same filament count). It must also report
      `meta[''mesh_hash'']` once per frequency: equal within a solve, new at each level, with `n_filaments`
      increasing.


      (4) **Independent self-checks.**

      - Ties: a bar split into 0.7 + 2.3 mm strips and tied at both ends, compared with the unsplit bar''s
      closed form. Error 2.9e-12, tolerance 4e-8.

      - Image plane: compared per unit length with a 2-D BEM that solves the plane''s surface current
      without using images. Error 2.0e-5, tolerance 3.6e-4.

      - Tube-PEEC: now discriminating at every length, including 1.5 mm. The corrected error must be at
      most r/l times the uncorrected error; the margin is ≥ 1.7×.


      (5) **Minor items.** The bars'' `regime_valid` tolerance now equals their stated 1e-4 bound. The
      bars'' informational HF solves no longer gate convergence, the noise floor comes from the solver
      tolerance the adapter reports, and the solver budget is now part of the interval.


      A scratch stand-in L2 found one real bug: the constant-ratio check failed at 1.0000000000000002
      on float rounding. It is fixed. The stand-in also confirmed that the order-2 case passes all 16
      checks, that a 3 % bias makes A1 fail as it should, and that additive refinement, per-frequency
      remeshing and superconvergence are all caught.'
