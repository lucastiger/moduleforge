  report:
    summary: 'E001 is still an unregistered draft. This task revised it to answer reviews T0058 and T0059,
      and every definition-of-done command now exits 0. The O001 acceptance criteria are unchanged. Commits
      are c6cbc54 and 915bbaf on branch task/T0060.


      (1) Refinement rule. Path A, T0057''s steady-order path, is unchanged. A new path B is the only
      place the rule''s verdict moves from "not converged" to "converged". Path B applies when:

      - every change has one sign;

      - the observed order falls at every step by more than the noise;

      - the last order is at least order_min;

      - no order exceeds order_max + 1 = 3.


      Path B''s estimate is the Richardson tail at order_min × 1.25, and never less than path A''s estimate.
      Two derivations, both in note §4.4, support it:

      - (a) Classification: for A h^p + B h^(p+dp) at a constant ratio, the observed order falls monotonically
      toward p if A·B > 0 and rises if A·B < 0.

      - (b) Lemma: for any number of same-sign terms with exponents ≥ order_min and any realized ratio,
      |d_last|/(ρ^order_min − 1) is an upper bound on the remaining error.


      Results on the registered path:

      - **Founder DoD:** power at p = 1 / 1.5 / 2 goes from 61 % / 12 % / 0 % to 100 % / 100 % / 100 %,
      with 0 false convergences among 1,542 opposite-sign sequences.

      - **Five other DoD seeds:** 0 false convergences among 7,488 opposite-sign sequences, and power
      100 % throughout.

      - **Two-term adversarial search** (any sign, ratio jitter): worst true/est is 0.80, i.e. the estimate
      was never below 1.25× the true error.


      The order cap is needed. Without it, an adversarial search found three-term cases on path B with
      true/est of 26–30.


      (2) Interval level. The band is no longer written into ci with a generator coverage in `level`.
      max_rel_err_vs_analytic is now recorded without a ci (A1 reads the point value). The band is reported
      as two metrics of its own, max_rel_err_band_lo and max_rel_err_band_hi, documented as a deterministic
      band with no confidence level. The self-check''s pooled coverage and its one-sided 95 % Clopper–Pearson
      lower bound go into the sanity detail, labelled generator-conditional: 1195/1195, lower bound 0.9975.


      (3) Scope and contract.

      - **Three-term expansions:** optimized mixed-sign cases still beat the rule, and the note states
      this. Worst true/est is about 2.5 with T0060 versus about 1.9 with T0057, and both rules admit false
      convergences there. Random three-term sampling gives 0 false convergences and coverage ≥ 0.998.

      - **Ratio cap:** the contract now caps realized refinement ratios at 2.2 (new config key refinement_ratio_max),
      the range the rule is validated on.

      - **Mesh keys:** the contract names required mesh_params keys (seg/fil_w/fil_h/surf per conductor;
      plane_x/plane_y/plane_layer per plane). The runner checks them.

      - **Integer counts:** the contract gives a composable rule for choosing them, with a table. Nominal
      1.25 with rounding never works; q = 1.3 needs a base count n0 ≥ 9, q = 1.5 needs n0 ≥ 10, q = 2
      works from 1.


      A stand-in L2 driven through --smoke confirmed the wiring:

      - the same-sign order > 2 case that T0057 refused now passes;

      - a missing mesh key fails l2_constant_refinement_ratio and l2_converged;

      - counts 10 → 13 → 16 fail the ratio check (1.0156).


      Commands run and their exit codes:

      - `uv run mfos exp check E001`: 0

      - `uv run ruff check experiments/runners/e001_reference.py`: 0

      - `--analytic-only`: 0

      - b1_exact_limits: 0

      - convergence_estimator: 0

      - design_contract: 0

      - b3_mutual_exact: 0

      - estimator_adversarial: 0, and 1 at the T0057 baseline

      - `uv run mfos gate --fast`: 0'
    failure_class: none
    root_cause: 'Design task, so no failure. The T0058 finding, confirmed first-hand, came from T0057''s
      rule: it treated every observed order above order_max as cancellation. Same-sign corrections always
      push the observed order above p without any cancellation, so accurate sequences at the formal order
      p = 2 were always refused (0/10,898).'
    evidence:
    - '[F] Baseline at T0057: estimator_adversarial.py exited 1. Power was 61/100 at p=1, 277/2304 at
