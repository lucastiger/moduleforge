    - 'Check the classification claim directly: for A h^p + B h^(p+dp) with A·B < 0 at constant ratio,
      the observed order is monotone increasing. Derivation in note section 4.4: f''(y) = c''(q^-dp -
      1)/(1 + c''y)^2.'
    - When the L2 adapter exists, inspect its actual convergence sequences before E001 runs. Orders above
      3 that fall at every level, or a noise floor near 2e-4, would predict l2_converged failing for a
      correct solver.
    recommended_actions:
    - 'Founder: review the choice to report the error band as two metrics without a ci, versus ci with
      level 1.0 (note section 7, item 11). Then decide registration request I0022.'
    - 'Founder or reviewer: accept or reject the measured trade-off. The power gain on same-sign sequences
      costs a larger worst case on optimized mixed-sign three-term expansions (about 2.5x versus 1.9x
      for T0057). If rejected, the only lever with 4-5 levels is a stricter order cap, which costs power
      when the correction is h^4.'
    - 'L2 builder (T0022): report every required mesh_params key; choose integer counts from the note
