description: 'Follow-up to reviews T0058 (physics) and T0059 (numerics) of T0057 (project/reviews/T0057/).
  E001 is still an unregistered draft (registration request I0022 waits for this task). Do not change
  O001''s acceptance criteria.


  (1) Power of the refinement rule (T0058, major; confirmed by the founder session on the registered path).
  Rejecting every observed order above order_max treats ordinary same-sign higher-order terms as cancellation:
  for e = A h^p + B h^(p+1) with A B > 0 the observed order always exceeds p, with no cancellation. Accurate
  sequences (true error < conv_tol / 10) are declared converged 61 % of the time at p = 1, 12 % at p =
  1.5 and 0 of 10898 at p = 2 (the formal order), so an accurate L2 would very likely fail l2_converged
  and make E001 INVALID. Distinguish same-sign superconvergent sequences (observed order above p, decreasing
  monotonically toward it, no sign reversal) from opposite-sign pre-asymptotic cancellation, e.g. by extrapolating
  conservatively at order_max (or order_min) instead of returning inf when the trend is consistent. Requirement
  (project/dod/e001-design/estimator_adversarial.py, registered path): >= 90 % acceptance of accurate
  same-sign sequences per leading order, and still zero false convergences on opposite-sign sequences.
  If both cannot hold with the contract''s 4-5 levels, stop and report blocked with the measured trade-off.

  (2) The interval `level` (both reviews). 0.98 is a constant of your synthetic generator written into
  MetricValue.level, whose schema meaning is the confidence level of `ci` (stats.py derives alpha from
  it). Do not put a generator coverage there as a CI level; record what the method supports and document
  it.

  (3) T0059''s three-term expansions still find modest false convergences (about 0.85x); state the validated
  scope (ratio range, number of terms) honestly. mesh_params key completeness is self-reported: require
  the adapter to report every discretization parameter the contract names. Small integer counts can violate
  the 1.25 ratio (10 -> 13 -> 16): say how the adapter must choose counts.


  The definition of done runs all of T0057''s checks; estimator_adversarial.py and convergence_estimator.py
  now exercise the registered path (h, order_range) as the runner calls it.'
