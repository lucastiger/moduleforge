    alternative_explanations:
    - explanation: 'Design alternative for the interval: keep the band in ci with level = 1.0, read as
        ''enclosure under the stated assumptions'' (consistent with alpha = 0 in stats.py).'
      how_to_discriminate: Not chosen, because the noisy and three-term self-check families measure coverage
        below 1 (0.998-0.999), so 1.0 would overstate. This is a founder choice, recorded as open item
        11 in note section 7.
    - explanation: 'Design alternative for the cap: set it at order_max + 2 = 4 instead of 3. That keeps
        100 % power when p = 2 has a strong same-sign h^4 correction.'
      how_to_discriminate: 'Measured: the cap of 4 lets the three-term adversarial worst case reach 4.6,
        against about 2.5 at the cap of 3. Power at p=2 with dp=2 is 88 % at cap 3 and 100 % at cap 4.
        A real L2 sequence showing observed orders between 3 and 4 that fall at every level would argue
