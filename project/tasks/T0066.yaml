description: 'Split from T0022 (founder session, 2026-10-04). Implement `moduleforge.solvers.l2.loop_inductance(layout,
  freqs_hz, refinement=0) -> LoopResult` (L_H, R_ohm aligned with freqs; meta with tool version, binary
  provenance per D0002, discretization sizes, solver_tol) on the exact in-house kernel of D0003, built
  on Layout.to_conductors() with the physics T0022''s description lists (graded trace cells, segmented
  bond wires, finite meshed backside Cu and baseplate, dies as ideal shorts, the to_conductors() port).
  T0022''s attempt 3 took > 30 min for one 2-die layout: the hot spot was inclined bond-wire segments
  coupled per filament pair (couple at segment level instead) and the uniform-mesh kernel reuse T0022
  adds. E002 will evaluate many sealed layouts: report the wall time per layout at refinement 0 and 1
  for 2- and 6-die layouts; T0024 sizes E002''s sample from it. Inclined-pair couplings must carry an
  error bound in solver_tol (attempt 3''s thin-filament centre-line approximation did not). Tests under
  tests/unit/solvers/ include the generated 2-die half-bridge within 1-100 nH.'
