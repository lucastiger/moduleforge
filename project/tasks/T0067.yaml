  report:
    summary: 'The spike says go: a rigorous exact-kernel L2 can run E001 exactly as registered. The one
      open item is C1 at level 4, which did not finish on this Mac. On the wire cases, every rigor element
      held unchanged: the frozen cases, the 2 % criterion, the refinement rule and ratio check, and the
      1e-5 solver budget with an honest solver_tol.


      Q1, wire convergence (this Mac, partly running alongside other jobs): B1, B2 and C0 all pass the
      frozen rule at level 4. The rule''s remaining-error estimates are at most 1.4e-4, the ratio check
      scores 0.956 (passes at ≤ 1), and errors against the closed forms are at most 1.04e-4.

      | Case | Unknowns, levels 1→4 | Time, levels 1→4 | Peak memory | Reported solver_tol |

      |---|---|---|---|---|

      | B1 | 81 → 441 | under 1 s | 0.2 GB (level 4) | ≤ 1.5e-13 |

      | B2 | 2,673 → 14,553 | 1.6 s → 603 s (dense LU) | 5.7 GB | ≤ 2.8e-12 |

      | C0 | 3,564 → 19,404 | up to 264 s | 4.1 GB | ≤ 3.8e-12 |

      Kernel quadrature and the far-field (proxy) truncation change L by at most 6.3e-13. Those two are
      measured, not bounded, and are not yet included in solver_tol.


      Q2, plane and C1: the plane kernel now takes 0.6–2.4 s, against the 21 min T0022''s whole C1 level
      1 took.

      | C1 level | Unknowns | Wall time | Peak memory | GMRES iterations | Error vs closed form |

      |---|---|---|---|---|---|

      | 1 | 21,852 | 35–42 s | 0.8 GB | 47–54 | +1.27e-3 |

      | 2 | 39,072 | 134–174 s | 2.0 GB | 52–61 | +7.2e-4 |

      | 3 | 77,824 | 489 s | 6.3 GB | 62–71 | +3.2e-4 |

      Each level costs about 3.2–3.8× the time and 2.6–3.1× the memory of the one before. The convergence
      order is steady at about 1.1. I stopped level 4 (about 136k unknowns) after 21.5 min at 4.3 GB under
      memory pressure, so C1''s rule verdict is pending the VM run.


      Q3, full E001 run (estimated, not measured): about 120–180 min serial on this Mac, which fits the
      240 min timeout but with little margin. On a GCP VM with every case in its own process it is about
      45–75 min. B3, B4 and the bars A1–A4 were not prototyped.


      Q4, E002 (estimated, about ±3×): each layout is about 0.5–0.6 M unknowns. That projects to 10–25
      min per layout per process, or 30–100 layouts per hour on a 256 GB VM. The layout path itself is
      not built.


      Q5: go for E001 as registered, no re-registration needed; productionizing is roughly 6–9 working
      days. E002 is a go on that estimate, with a separate 2–3 week build for the layout path.


      How it works: wires use graded annuli with azimuthal modes, exact same-axis couplings, and moment-matched
      proxy filaments for distant ones. The plane uses a uniform grid with its kernel computed once per
      distinct offset and applied by FFT. Solves use GMRES with a rigorous a-posteriori bound on Z (|dZ|
      ≤ ‖P(Mx)‖²/r_min). That bound settles T0022 attempt 2''s objection that an iterative solve could
      not meet the budget.'
    failure_class: implementation
    root_cause: T0022 missed time and memory because of how it discretized and solved, not because of
      the physics or the frozen rule. Wire cross-sections used square stand-ins for annular sectors with
      coarse surface cells, which made the convergence sequences unsteady. C1 evaluated about 20 M wire–plane
      pairs by quadrature with no reuse, then solved densely. Exact annuli with azimuthal modes, a plane
      kernel computed once per distinct offset and applied by FFT, proxy-compressed wire–plane coupling,
      and GMRES with a rigorous residual bound remove both problems.
