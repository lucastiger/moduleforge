description: 'Replaces failed T0022 (4 attempts). It uses the design measured by the founder-approved
  spike T0067 (research/diagnoses/T0067.md) and reviewed in T0068 (project/reviews/T0067/T0068.json).
  Turn research/scripts/spike_l2/l2proto.py into production code under src/moduleforge/solvers/. Put the
  public API in l2.py, exactly as specified in the contract in research/notes/o001-l2-reference.md section
  3 (Bar, RoundWire, Plane, Terminal, Port, Tie, solve, Result, MAX_REFINEMENT >= 5). Put the internals
  in l2_core.py. SCOPE: RoundWire and Plane with any number of ports. Bar and Tie may raise NotImplementedError;
  n2 adds them. Do not edit experiments/, research/notes/ or the spike scripts.


  Required:

  (1) Wires: graded annuli with azimuthal harmonics m <= P, exact coaxial Toeplitz tables, and moment-matched
  proxy filaments for other edges and the plane, as in the spike. Choose counts so every realized ratio
  is inside the contract band.

  (2) Plane: compute the kernel once per distinct (offset, layer pair) and apply it by FFT. Plane thickness
  layers must refine consistently with the constant ratio (e.g. a fixed number of layers per skin depth,
  refined with the level counts) and must appear in mesh_params. The spike''s x2-graded layers had a ~1
  % internal-L floor and non-monotone jumps (T0068 finding 4). If C1 is not steady by level 4, suspect
  the uncovered plane-rim half-cells (an O(a) term, T0067) and fix the discretization. Never touch the
  rule.

  (3) Wire-to-plane coupling: COMPRESSED, not stored dense (founder amendment, 2026-10-04). The spike''s
  GCP benchmark (research/spike_l2_results/C1_k4.json) measured C1 level 4 at 16.0 GB peak, of which the
  dense wire-to-plane block is ~10 GB (22,932 x 56,448 float64), with a 343 s build growing ~3x per level.
  Chunked recomputation would rebuild it on each of ~70 GMRES iterations, so use a compressed operator,
  e.g. precorrected FFT: project the proxy currents onto the plane''s lateral grid, apply by FFT, and
  correct the near field exactly. Its error bound is a stated bound counted in solver_tol (item 4, D0004).
  Parallel over cores. C1 level 4 must fit in <= 12 GB on this 17 GB Mac and leave room for the 40-minute
  E001 smoke run. Expose the operator in l2_core: the layout path (n4a) reuses it for wire-to-plane and
  wire-to-trace coupling instead of building its own.

  (4) Solve: dense LU for small systems, otherwise GMRES with the block preconditioner. meta[''solver_tol'']
  = the rigorous a-posteriori bound ||P(Mx)||^2/r_min, plus rounding, plus STATED BOUNDS (not measured
  changes) for: kernel quadrature, proxy truncation ~(r/D)^(P+1), and the plane-table and wire-to-plane
  quadrature. T0068 finding 3: plane kernels showed ~5e-9, not 6e-13.

  (5) meta per the contract: solver_tol; n_filaments (increasing per level); mesh_params with every required
  key; mesh_hash computed from the mesh actually built, with one equal entry per frequency of the call;
  tool name and version; wall_s. One mesh per call. Meshes defined relative to geometry and skin depth,
  so length scaling is exact.

  (6) Design the core for reuse. The layout path (n4a, in parallel with n2) imports l2_core without editing
  it, so expose as functions: the kernel tables, multi-plane FFT operators on a shared lateral grid, the
  GMRES driver and the bound.


  Tests in tests/unit/solvers/test_l2_core.py:

  - kernel entries vs an independent high-precision quadrature (<= 1e-9);

  - convergence in quadrature order and in P, including the plane and wire-to-plane kernels;

  - the a-posteriori bound >= the true Z error, against a dense LU on a small plane case;

  - reciprocity on a two-port wire case;

  - mesh_params exactly doubled when lengths are doubled and f is divided by 4;

  - L non-increasing with frequency;

  - B1 against its closed form.

  Cite every closed form (skill mf-conventions). Report C1''s level sequence and its time and memory per
  level.'
