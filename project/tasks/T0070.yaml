      What was built:

      - l2_core.py: the core, split into functions the layout path can import.

      - l2.py: the public API. Bar and Tie raise NotImplementedError. RoundWire and Plane work with any
      number of ports.

      - tests/unit/solvers/test_l2_core.py: 25 tests, about 16 s.


      The core:

      - Graded annuli with azimuthal harmonics, exact coaxial Toeplitz tables, and moment-matched proxy
      filaments for other edges and the plane.

      - A plane kernel computed once per distinct (offset, layer pair), applied by FFT.

      - Dense LU for small systems, otherwise GMRES with a block/Schur preconditioner.

      - solver_tol is the rigorous a-posteriori bound ‖ρ_i‖‖ρ_j‖/r_min, plus rounding, plus stated bounds
      for the coaxial tables, proxy truncation, plane-table quadrature and wire-to-plane quadrature.


      Design choices that need your review:

      1. **Wire-to-plane coupling (item 3).** The wire-to-plane block is never stored dense. For an edge
      whose segment length equals the plane''s axial cell it is Toeplitz in the axial index, so it is
      stored as a table over (proxy, layer, lateral row, axial offset) and applied by FFT along the edge.
      That is exact (no compression error), and memory is O(Q·nl·n2·(n+n1)) instead of O(Q·n·nl·n1·n2).
      A segment length that does not match the plane cell raises NotImplementedError, so the generality
      of a true precorrected FFT is not there. The layout path (n4a) needs either the same alignment or
      an axial-resampling extension. I did not build that, and `solve()` currently supports only one plane.

      2. **Mesh counts changed.** The spike''s cells (a/h ≈ 1.1 at level 1) gave non-steady orders and
      the frozen rule returned inf. A control with the wire at 1.5 mm and 2 mm (same cell size, larger
      gap) converged. So segments per edge are now 14/18/24/32/42 (ratios 1.286/1.333/1.333/1.3125) and
      annuli 9/12/16/21/28. Plane layers are 7/9/12/16/21 with one fixed smooth grading rate, replacing
      the x2-graded layers. The plane cell equals the segment length along each axis.

      3. **Proxy order.** P is chosen from the stated bound (1e-9 with no plane, 2e-7 with a plane). C1
      gets P=9, because with P=8 the reported solver_tol (~3.9e-6) widened the rule''s noise floor and
      the rule returned inf.

      4. **Coaxial kernel tolerance is a nested-rule estimate.** The coaxial tables are built twice (default
      rule and a 1.5× richer rule). The difference ×10 is reported as the stated error scale, which is
      a measured estimate rather than an a-priori bound. The u=0 kink quadrature needed ngk=64 and panels=60,
      because ngk=12 gave 1e-7 relative error.

      5. **Gauss-error bound assumption.** Plane-table and wire-to-plane quadrature bounds use the Gauss–Legendre
      Bernstein-ellipse theorem with an assumed factor of 10 between the integrand on the ellipse and
      on the real interval (`ELLIPSE_M`). They come out around 1e-13.


      Not done or not verified:

      - Only B1, B2 and C1 were run against E001. Bars, ties and inclined wires raise NotImplementedError.

      - B3''s solver_tol requirement (4.1e-9) was not run through the runner. B3''s mutual coupling would
      get P≈8–9 under the 1e-9 no-plane target, and B2 level 1 reports 2.2e-10.

      - The runner''s 40-minute smoke run was not run. C1 level 4 alone takes about 5–7 min and 7.8 GB,
