- cmd: 'uv run python -c "import importlib.util as iu, math, sys, numpy as np; s=iu.spec_from_file_location(''e001r'',
    ''experiments/runners/e001_reference.py''); e=iu.module_from_spec(s); sys.modules[''e001r'']=e; s.loader.exec_module(e);
    from moduleforge.solvers import l2; cfg=e.checked_config({}); cfg[''refinement_max'']=cfg[''refinement_start'']+cfg[''refinement_min_levels'']-1;
    sig={e.CU: float(cfg[''sigma_cu'']), e.AL: float(cfg[''sigma_al''])}; c=e.build_cases(cfg, ids=[''C1''])[0];
    f=2.0e7; c[''cmp_freqs'']=[f]; c[''info_freqs'']=[]; z,rem,k,ms=e.l2_converged_solve(l2, c, [f], sig,
    cfg); lab,i,j=c[''compare''][0]; a=e.analytic_values(c, [f], sig)[(lab, f)]; v=float(np.imag(z[0,i,j])/(2*math.pi*f));
    err=abs(v-a)/abs(a); r=max(rem.values()); t=max(float(m[''solver_tol'']) for m in ms)/e.solver_tol_required(c,
    sig, cfg); h=e.refinement_ratio_violation(ms, cfg, e.required_mesh_keys(c)); mb=e.one_mesh_violations(ms,
