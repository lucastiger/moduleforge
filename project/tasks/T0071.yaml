description: 'Completes moduleforge.solvers.l2 for E001 on n1''s core. This is the rest of failed T0022''s
  scope.


  Implement:

  - Bar via the exact Hoer & Love (1965) kernel (D0003), with distinct-offset (Toeplitz) reuse, and cross-section
  cells graded to skin depth/2 at the finest levels under the constant ratio (contract section 3 of research/notes/o001-l2-reference.md).

  - Multi-port Z with every port column and the contract''s sign convention (A3, A4, B3).

  - Tie as an ideal zero-impedance connection (B4).

  Keep the contract API exactly. Do not edit experiments/runners/e001_reference.py, experiments/specs/
  or the note. FastHenry is optional under D0003: no binary is required. If you use it as a cross-check,
  record meta[''fh_zc_rel_diff''].


  Speed: the frozen E001 smoke run must finish within its 40-minute DoD limit. Then measure and report
  a projection for the full registered run on this Mac against the frozen timeout_min = 240. The full
  run covers 10 cases, levels up to 5 where the rule needs them, 100 Hz plus 5/20/80 MHz, and scaling
  solves for A1, B2 and C1. That includes two C1 solves at its final level (T0068 finding 5). If the projection
  exceeds 200 min, stop and report blocked with the numbers: moving E001 to a burst host means re-registering
  cpu_hours_est, which is a founder decision.


  Tests in tests/unit/solvers/test_l2_e001_*.py:

  - Bar self and mutual inductance vs Hoer-Love and an independent quadrature;

  - Im Z12 > 0 for parallel ports pointing the same way;

  - tie assembly vs the explicit parallel formula (Z11 Z22 - Z12^2)/(Z11 + Z22 - 2 Z12);

  - reciprocity;

  - exact length scaling;

  - solver_tol vs a dense LU.

  Cite closed forms. Never weaken a test or tolerance. Do not change files under src/moduleforge/solvers/l2_layout.py
  (n4a works there in parallel).


  Founder amendment (2026-10-05), from the reviews of T0070 (project/reviews/T0070/T0079.json, T0080.json).
  Required:


  (R1, major, T0079) E001 solves C1 at 5, 20 and 80 MHz in one call, on one mesh graded to 80 MHz. With
  that grading the plane''s surface layer (plane_layer:gnd) shrinks by up to 1.4196 per level (L2 -> L3),
  while segments and plane cells shrink by 1.2857. The ratio spread is then 1.1041 > refinement_ratio_spread
  1.1, and refinement_ratio_violation = 1.0037, so E001''s l2_constant_refinement_ratio sanity check fails
  and E001 would be INVALID. T0070''s checks ran C1 at 20 MHz only. Fix the grading (l2_core may be edited)
  so every mesh parameter refines at one ratio, within the spread, for any max frequency and every E001
  case. Add l2.mesh_meta(conductors, planes, ports, freqs_hz, refinement, ties=()), which returns the
  mesh_params, n_filaments and mesh_hash that solve() would put in meta for the same arguments. Build
  it through the same code path as solve(), without solving, and add a unit test asserting equality with
  solve()''s meta. The new definition-of-done check runs it on every E001 case at the case''s registered
  frequencies.


  (R2, T0080) mesh_params must be real mesh sizes. For round wires, fil_w = pi*r/c and fil_h = r/c are
  nominal values. The real azimuthal resolution is the harmonic cutoff m <= P, and P is fixed across levels,
  so the constant-ratio check passes by construction. Report sizes the mesh actually has. Every key the
  runner requires (required_mesh_keys) must be a real size that refines at the constant ratio; if that
  means P grows with the level, grow it.


  (R3, T0080) Count float64 cancellation in the Hoer-Love box formula on thin layers as a stated rounding
  bound in solver_tol. Against 50-digit mpmath on C1''s real layer stacks, entries were off by up to 4.6e-8
  relative, which the current rounding term (~2e-10) does not cover. Extend test_plane_table_entries_vs_independent_quadrature
  to the 1-7 um surface layers that real meshes use.


  (R4, T0080) block_gmres ignores scipy''s convergence flag. Record it per solve in meta (e.g. gmres_info)
  and never drop it silently.


  (R5, T0079) C1 level 4 took 1518 s at 20 MHz against 113 s at level 3 (963k unknowns: 13x the time for
  2.3x the unknowns, which points to memory pressure). The E001 projection must include peak RSS per level
  and the C1 solves at all three frequencies.'
