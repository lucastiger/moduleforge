      \ frequencies, and about 580 s for the scaling solves including C1's two solves at its final level.\
      \ If C1 needs level 5 at 80 MHz, add roughly 30–60 min; that level's memory would likely exceed\
      \ this Mac's 16 GB but fits the burst VM. Either way this is far below the 240-minute timeout."
