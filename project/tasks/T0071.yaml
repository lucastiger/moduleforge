  timeout_s: 1800
- cmd: uv run ruff check src/moduleforge/solvers tests/unit/solvers
  exists: null
  timeout_s: 300
- cmd: rm -rf /tmp/e001-smoke && uv run python experiments/runners/e001_reference.py --smoke && uv run
    python -c "import json; r=json.load(open('/tmp/e001-smoke/result.json')); assert r['status']=='complete',
    r['status']; assert r['sanity'] and all(s['passed'] for s in r['sanity']), r['sanity']; v=r['metrics']['max_rel_err_vs_analytic']['value'];
    assert v <= 0.02, v; print('E001 smoke max_rel_err', v)"
  exists: null
  timeout_s: 2400
- cmd: "uv run python - <<'EOF'\nimport importlib.util as iu, sys\ns = iu.spec_from_file_location('e001r',\
    \ 'experiments/runners/e001_reference.py'); e = iu.module_from_spec(s)\nsys.modules['e001r'] = e;\
    \ s.loader.exec_module(e)\nfrom moduleforge.solvers import l2\ncfg = e.checked_config({}); sig = {e.CU:\
    \ float(cfg['sigma_cu']), e.AL: float(cfg['sigma_al'])}\nk0, km, nmin = cfg['refinement_start'], min(cfg['refinement_max'],\
    \ l2.MAX_REFINEMENT), cfg['refinement_min_levels']\nworst, bad = {}, {}\nfor c in e.build_cases(cfg):\n\
    \    fr = sorted(set(c['cmp_freqs']) | set(c['info_freqs']))\n    cd, pl, po, ti = e._to_l2(l2, c,\
    \ sig)\n    ms = [l2.mesh_meta(conductors=cd, planes=pl, ports=po, freqs_hz=fr, refinement=k, ties=ti)\
    \ for k in range(k0, km + 1)]\n    worst[c['id']] = max(e.refinement_ratio_violation(ms[:n], cfg,\
    \ e.required_mesh_keys(c)) for n in range(nmin, len(ms) + 1))\n    bad[c['id']] = e.one_mesh_violations(ms,\
    \ len(fr))\nprint('ratio violation per case (registered frequencies, every stopping level):', worst,\
    \ 'mesh violations:', bad)\nassert all(v <= 1.0 + 1e-9 for v in worst.values()) and not any(bad.values()),\
    \ (worst, bad)\nEOF"
  exists: null
  timeout_s: 900
- cmd: grep -rnE 'git clone|urlopen|urlretrieve|wget' src/moduleforge/solvers; test $? -eq 1
  exists: null
  timeout_s: 30
