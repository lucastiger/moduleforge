    concerns:
    - 'Reading of R2: the harmonic cut-off M (reported as fil_w = pi*r/M) now refines with the level,
      but the proxy order used for couplings between different wire edges and to the plane stays at P_sel,
      the order its stated truncation bound needs. Harmonics above P_sel get zero far-coupling weight,
      which is covered by the stated tail q^(P+1)/(1-q) in solver_tol (new unit test). A reviewer should
      confirm this reading of R2; raising the proxy order with M made C1 and B3 too slow and memory-heavy
      on this Mac.'
    - 'A2 is not in the smoke. Under the frozen rule it does not converge at level 4 (rem = inf: changes
      of about 2-3e-9 relative that are not yet in a steady order; err vs analytic 5e-8) and converges
      at level 5 (rem 7.4e-9, 35 s, peak 8.0 GB). This was measured in a probe at the smoke''s frequencies,
      not in the full run.'
    - A3 and A4 converge at level 4 (rem at most 3.7e-8), so the registered rule should not take them
      to level 5. If it did, the bar system (37,044 unknowns) would need about 11 GB for the real L plus
      5.5 GB for the float32 error-bound matrix. That fits the burst VM (251 GB) but not this 16 GB Mac.
      Toeplitz storage along the bars (the packet's other example) was not implemented; the GMRES-with-real-L
      option was.
    - The full-run projection (about 55 min on this Mac, plus 30-60 min if C1 needs level 5) is extrapolated
      from 1-2 frequency timings, not measured. As the packet instructed, C1 at 5 and 80 MHz was not run,
      so its convergence and memory at those frequencies are unshown. All timings were taken while other
      agents' jobs were using the machine (load about 9, heavy swap), so they are noisy.
    - R3 was handled by evaluating the Hoer-Love corner sums in double-double (new module src/moduleforge/solvers/l2_dd.py,
      from the previous attempt) with a stated rounding bound counted in solver_tol, rather than by adding
      the measured float64 error of 4.6e-8 to solver_tol. Thin-layer entries match an independent 70-digit
      decimal evaluation and the extended quadrature test.
    - Background wait loops bpdsul5km and bb5krtuiw were stopped at their time limit. Both were waiting
      on probes I had already killed or superseded and did not affect any check; their measurements were
      re-taken directly (B3 level 4 at 111 s, C1 level 4 at 236 s).
