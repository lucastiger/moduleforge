description: 'Restores T0069 plan node n4a, which the open-task-limit bug dropped; the founder asked for
  its restoration on I0032. It re-issues founder task T0066 (blocked by failed T0022) on T0070''s core.
  It is amended for D0004 and for the founder''s change to T0070 (item 3).


  Implement src/moduleforge/solvers/l2_layout.py: loop_inductance(layout, freqs_hz, refinement=0) -> LoopResult.

  - L_H and R_ohm are arrays aligned with freqs.

  - meta has: tool_version; a sha256 of the solver source files (D0004 provenance, with no FastHenry binary
  and no binary_path/binary_sha256); n_unknowns; mesh params; solver_tol; wall_s; cpu_s; gmres_iters.

  - Build on Layout.to_conductors() (src/moduleforge/geometry/).

  - Import from moduleforge.solvers.l2_core. Do not edit l2.py or l2_core.py: T0071 changes them in parallel,
  and E001 (T0072) validates that code. Put any extension in l2_layout.py.


  Physics (no image planes):

  - top-Cu traces as a masked 2-D current grid, so current spreads across wide traces (T0022''s 1-D bars
  did not);

  - backside Cu and baseplate as finite meshed planes at their true extent and thickness;

  - all three on one shared lateral grid, so every Cu-to-Cu block is block-Toeplitz and applied by FFT;

  - bond wires as inclined round segments with the closed-form non-parallel filament mutual (Grover 1946),
  coupled through the proxy filaments, with the error bound included in solver_tol (T0022''s centre-line
  approximation had none);

  - dies as ideal shorts;

  - the same port as to_conductors();

  - one mesh per call.


  Coupling: for wire-to-plane and wire-to-trace coupling, REUSE the compressed operator that T0070 exposes
  in l2_core (e.g. precorrected FFT). Do not build a dense block or a second implementation. Memory and
  time must grow about linearly with wires x grid. T0068 finding 1: a dense array would need 26-118 GB
  and about 1 h of kernel build per layout.


  Solve: use l2_core''s GMRES driver (a small system may use the dense direct solve). Per D0004 (i), meta[''solver_tol'']
  is the sum of: the a-posteriori bound ||P(Mx)||^2/r_min, a rounding bound, and STATED (derived, not
  measured level-to-level) bounds for kernel quadrature, proxy truncation, the compressed operator, and
  the plane and wire-to-plane tables.


  Tests in tests/unit/solvers/test_l2_layout*.py:

  - inclined filament mutual vs an independent quadrature (<= 1e-9 relative);

  - a straight trace at 100 Hz vs the Hoer-Love (1965) bar self-inductance closed form, implemented independently
  in the test;

  - the layout path''s internals on E001''s C1 geometry vs l2.solve at the same refinement, agreeing within
  0.5 %;

  - reported solver_tol >= the true relative Z error against a dense LU on a layout small enough for one
  (D0004 consequence);

  - reciprocity of a two-port;

  - L non-increasing with frequency;

  - doubling all lengths and dividing f by 4 gives 2L;

  - the generated 2-die half-bridge within 1-100 nH.

  Cite every closed form (skill mf-conventions). Never weaken a test or tolerance. Report wall time, CPU
  time, peak memory and GMRES iterations for seed 7 at 2 and 6 dies per switch, refinement 0.


  Founder amendment (2026-10-05), from review T0080 of T0070: l2_core''s FFT wire-to-plane operator only
  works when every wire segment length equals the plane cell along that axis and the plane extent is a
  whole number of segments. Otherwise it raises NotImplementedError, and it also raises for collinear
  parallel edges or parallel edges closer than 2.5 r. C1 happens to fit this lattice; generated layouts
  will not. l2_layout.py must therefore provide the general projection itself, e.g. precorrected FFT onto
  the shared grid with the near field corrected exactly, with its error bound counted in solver_tol (D0004).
  l2_core is still not edited here.'
