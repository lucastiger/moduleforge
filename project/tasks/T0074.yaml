    both rest on leaving this term out.

    - [major] l2_core''s compressed wire-to-plane operator is not reused, contrary to the claim: The claim
    says the path reuses l2_core''s compressed wire-to-plane operator. l2_core.WirePlaneOp / wire_plane_op
    are never referenced. l2_layout writes a new precorrected-FFT operator (WireGridPFFT) and reuses only
    plane_table, circulant_fft/apply, Gauss helpers, block_gmres and a_posteriori. l2_core''s operator
    only supports axis-parallel edges whose segment length equals the cell size (it raises NotImplementedError
    ''(layout path)''), so arc bond wires could not reuse it as written. The new operator therefore does
    not inherit l2_core''s validation, and the claim misstates what was built.

    - [major] L at a given frequency depends on which other frequencies are requested (mesh graded to
    max(freqs)): The thickness layers are graded to the skin depth at max(freqs_hz), so the same layout,
    frequency and refinement give different answers depending on the rest of the frequency list. The DoD
    layout at 20 MHz gives L = 11.573 nH inside the [5e6, 2e7, 8e7] call and 11.283 nH when called with
    [2e7] alone, a 2.6% difference. R changes by 52% (0.105 vs 0.069 Ω). This spread is about 70× the
    reported solver_tol, so the L(f) curve and the monotonicity assertion partly reflect the mesh choice.
    In the 3-frequency call, R(20 MHz)/R(5 MHz) = 4.07, where skin-effect scaling would give about 2.
    That points to an under-resolved current profile at the lower frequencies.

    - [major] Refinement-0 results are about 10% from convergence, and solver_tol grows past 1e-3 with
    refinement: On the test file''s tiny_layout at 20 MHz, L falls 6.199 → 5.730 → 5.561 nH from refinement
