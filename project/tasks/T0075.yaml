definition_of_done:
- cmd: rm -rf /tmp/l2cost && uv run python benchmarks/l2_layout_cost.py --quick --out /tmp/l2cost
  exists: null
  timeout_s: 5400
- cmd: 'uv run python -c "import json, math; r=json.load(open(''/tmp/l2cost/cost.json'')); rows=r[''solves''];
    k=r[''k_star'']; assert isinstance(k, int) and k >= 0, k; assert rows and {x[''dies_per_switch'']
    for x in rows if x[''refinement''] == k} >= {2, 6}, rows; assert all(math.isfinite(x[''L_H'']) and
    1e-9 < x[''L_H''] < 1e-7 for x in rows), rows; assert any(x[''refinement''] == k + 1 for x in rows),
    ''no solve at k_star+1''; bad=[x for x in rows if x[''refinement''] == k and (x[''cpu_s''] > 2400
    or x[''peak_rss_gb''] > 12)]; assert not bad, bad; conv=r[''convergence'']; assert conv, conv; ok=lambda
    c: abs(c[''rel_change'']) < 1e-4 or (abs(c[''rel_change'']) < 0.01 and (c.get(''prev_change'') is
    None or (abs(c[''rel_change'']) < abs(c[''prev_change'']) and c[''rel_change''] * c[''prev_change'']
    > 0))); assert all(ok(c) for c in conv), conv; print(''k_star'', k, [(x[''dies_per_switch''], x[''refinement''],
    round(x[''cpu_s'']), x[''peak_rss_gb'']) for x in rows], conv)"'
  exists: null
  timeout_s: 120
- cmd: null
  exists: research/notes/o001-l2-layout-cost.md
  timeout_s: 60
- cmd: uv run pytest -q tests/unit/solvers
  exists: null
  timeout_s: 1800
- cmd: uv run ruff check benchmarks/l2_layout_cost.py src/moduleforge/solvers tests/unit/solvers
  exists: null
  timeout_s: 300
