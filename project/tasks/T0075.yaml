description: 'Restores T0069 plan node n4b (dropped by the open-task-limit bug; restoration requested
  by the founder on I0032). The goal is to make the layout L2 affordable and convergent at E002 scale,
  and to measure it, so that E002 is sized from data. T0068 finding 1: do not use T0067''s 30-100 layouts/h.


  Write benchmarks/l2_layout_cost.py with options --out DIR and --quick.

  - Each solve runs in a fresh subprocess.

  - Each solve records: seed, dies_per_switch, refinement, f_hz = 2e7, L_H, R_ohm, wall_s, cpu_s (the
  child''s user+sys time over all threads), peak_rss_gb, n_unknowns, gmres_iters, solver_tol.

  - Output goes to DIR/cost.json as {''solves'': [...], ''convergence'': [{''seed'', ''dies_per_switch'',
  ''rel_change''}]}, with rel_change = (L_ref1 - L_ref0)/L_ref1.

  - --quick: seed 7 at 2 dies per switch (refinement 0 and 1) and at 6 dies (refinement 0).

  - Full mode adds at least 3 more unsealed dev seeds across families and 2-6 dies, at refinement 0 and
  1.


  Optimize l2_layout.py (parallel kernel assembly, preconditioner, FFT reuse across frequencies) until:

  - every refinement-0 solve uses <= 2400 CPU-s and <= 12 GB;

  - the change from refinement 0 to refinement 1 is < 1 % (E002''s l2_converged criterion from T0024).

  Do not edit l2.py or l2_core.py, because E001 validates that code. solver_tol stays as D0004 defines
  it, including the bound for any compression. Budget rationale: O001 has 60 CPU-h, and E002 needs on
  the order of 60-90 layouts plus a refinement subset.


  Write research/notes/o001-l2-layout-cost.md with:

  - the full-mode table;

  - cost per layout vs dies per switch and refinement;

  - how GMRES iterations grow;

  - the projected E002 CPU-h as a function of n.

  If the gates cannot be met, stop and report blocked with the measurements; the founder then decides
  (multi-fidelity search or more compute). Do not coarsen the model until the check passes. Never use
  a sealed seed.


  Founder amendment (2026-10-06), from reviews T0083 and T0084 of T0074 (project/reviews/T0074/T0083.json,
  T0084.json). It supersedes the refinement-0 gates above.

  (1) Refinement 0 cannot be E002''s level. Its top-Cu thickness layers (3.3 and 146.7 um, graded to 100
  MHz) do not resolve the 15-30 um skin depth at 5-20 MHz, and its L is 3-14 % off. Pick the level E002
  will use, k_star: the lowest refinement whose thickness layers resolve the skin depth at the comparison
  frequency (20 MHz). Record k_star and the layer thicknesses in cost.json. The gates apply at k_star:

  - cost: <= 2400 CPU-s and <= 12 GB per solve at k_star;

  - convergence: |L(k_star+1) - L(k_star)| / L(k_star+1) < 1 % at 20 MHz on every measured layout, and
  the change from k_star-1 to k_star must be larger in magnitude and of the same sign, i.e. contracting
  with no turning point. A change below 1e-4 counts as converged.

  Report R''s convergence separately; it is not gated. --quick now runs seed 7 at 2 dies per switch at
  k_star-1, k_star and k_star+1, and at 6 dies at k_star. Full mode adds the dev seeds at k_star and k_star+1
  wherever they fit; say where they did not.

  (2) Correctness fixes in l2_layout.py before measuring; E002''s reference values depend on them. Add
  a test for each.

  - Die shorts use DieShort.net, so they connect only that net''s cells.

  - segment_mutual''s near-parallel band around PARALLEL_SIN gets an accurate evaluation, or a stated
  bound counted in solver_tol. The general form cancels just above sin = 1e-6; the parallel substitution
  has an O(sin) error below it.

  - _nearest_cell handles a trace narrower than one cell.

  - WireGridPFFT does not raise for wire nodes near the grid edge when no far branch exists.

  (3) Add a layout-level test with an independent reference, so a mapping error of more than a few percent
  (port cells, landing cells, die shorts) fails. Examples: a two-trace hairpin layout whose loop L is
  known to <= 1 %, or the equivalent conductor model solved through l2.solve.

  (4) solver_tol is relative to max|Z_ii|. Also report it relative to L = Im Z / omega at each frequency,
  so it can be read as an L tolerance.


  Founder decision (2026-10-06) on attempt 2''s blocked report. This is the last attempt.

  The refinement sequence did not measure one geometry. Traces are meshed as the cells whose centre lies
  inside a trace, so the conducting area changes from level to level: DC+ error 0, +5.8, 0, -4.2, 0 %
  at refinements 0-4. It is zero exactly at the 1.0, 0.5 and 0.25 mm cells and non-zero at 0.7 and 0.35
  mm. The generator rounds dimensions to 0.1 mm, so no affordable uniform ladder divides every layout''s
  edges. Until every level represents the same conductors, the convergence result cannot be interpreted.

  (1) Implement partial-cell weighting of trace edge cells for top Cu and backside Cu: each cell carries
  the exact fraction of its area covered by its net, e.g. as a fill-fraction conductance. A geometric
  partial cell is acceptable if it keeps the FFT structure. The represented area of every net must be
  exact at every refinement. Add a test: per-net area relative error <= 1e-12 at refinements 0-4 on seed
  7 and on one other generated layout. Keep the CELL ladder, the uniform shared grid and the FFT operators.

  (2) Re-run --quick (seed 7, 2 dies: k_star-1, k_star, k_star+1; 6 dies: k_star) and apply the gates
  unchanged. Re-derive k_star if the weighting changes it.

  (3) If convergence still fails with exact areas, report blocked with the measurements. Separate the
  remaining contributions (wire filaments, thickness layers) as far as one or two extra solves allow.
  Do not change the gates, and do not coarsen.

  (4) The note belongs in docs/notes/o001-l2-layout-cost.md, since research/notes is outside the builder''s
  write scope; the definition of done now checks that path. Keep attempt 2''s speed-up and correctness
  fixes. Describe the bilinear wire-foot contacts, a model change beyond the earlier packet, in the note
  and the module docstring.


  FOUNDER RE-SCOPE (2026-10-07, inbox I0039). It replaces the partial-cell approach of attempt 3. Read
  research/l2_layout_diag/summary.json and research/scripts/l2_layout_lateral_diag.py.

  Evidence: a founder diagnostic on a GCP n2-highmem-32, not evidence for E002. It used the generator''s
  own u_shaped 2-die layout with every free parameter on the 0.5 mm grid. With thickness layers and wire
  filaments held at k_star, pure lateral refinement converges smoothly: 0.5 / 0.25 / 0.125 mm cells give
  12.8885 / 12.7662 / 12.6915 nH, i.e. -0.96 % then -0.59 % (contraction 0.61, observed order about 0.7).
  The same layout at the non-aligned 0.7 and 0.35 mm cells, with partial-cell weighting, gives 11.787
  and 12.193 nH, 5-9 % low. Partial cells, with their full-box inductive footprint, are the error source,
  not a fix. The generator also places dies at continuous x positions, so die footprints never align with
  any cell.

  Required:

  (1) Generator. Snap every free geometric parameter in src/moduleforge/generate/halfbridge.py to a 0.5
  mm design grid: die size s, gaps g and dg, extensions e, and the die-row start xs (snap the row start,
  not the centre). Then all trace edges and die footprints lie on that grid; the housing constants already
  do. Keep the families, the die counts and DRC validity, and document the change in the module docstring.
  Update tests that pin generated values only where the generator change forces it, and list them in the
  report.

  (2) Lateral ladder. Nested cells that divide the design grid, e.g. CELL = (0.5, 0.25, 0.125) mm. The
  lattice origin and extent must keep every feature on cell boundaries; the baseplate box -8..78 x -8..48
  mm already does. Hold thickness layers and wire filaments at the resolving counts (attempt 3''s index
  3: top 10, back 6, base 6) at every lateral level. At k_star, report their sensitivity with one extra
  solve each (+2 layers; the next finer wire edges). Required |change| < 0.2 %; attempt 3 measured -0.04
  % and +0.02 %.

  (3) l2_layout raises ValueError when a layout''s features are not on the lattice at the requested refinement,
  instead of weighting partial cells. Keep the exact per-net area test as the alignment check. Keep attempts
  1-3''s correctness fixes, speed-ups, the layout-level reference test and solver_tol_rel_L.

  (4) GMRES at the finest level. At 0.125 mm the solve hit its 500-iteration cap (restart 100 x 5) and
  reported solver_tol 1.2e-3. Make it converge, via the cap, the restart or the preconditioner, so solver_tol
  < 1e-3 at every level.

  (5) What runs where. The k_star+1 level (0.125 mm) needs about 35 GB and about 3 h, and does not fit
  this 16 GB Mac.

  - On this Mac (the DoD''s --quick run): seed 7 at 2 dies, plus one layout of another family, at k_star-1
  (0.5 mm) and k_star (0.25 mm); and 6 dies at k_star. The cost gate at k_star is unchanged: <= 2400 CPU-s
  and <= 12 GB per solve.

  - Add a --vm mode to benchmarks/l2_layout_cost.py. It runs k_star-1, k_star and k_star+1 for 3 dev layouts
  across families (2 and 6 dies), in parallel with a --jobs option, and writes cost.json. The founder
  runs it on the burst VM after this task merges.

  - The convergence gate (< 1 % from k_star to k_star+1, contracting, a change below 1e-4 counting as
  converged) is applied to the VM run before E002''s design (T0076) starts. The DoD''s cost.json check
  below therefore no longer requires a k_star+1 solve.

  (6) Update docs/notes/o001-l2-layout-cost.md with the diagnostic, the new ladder and the cost per layout.


  FOUNDER AMENDMENT for the final attempt (5 of 5; 2026-10-07). It supersedes item (5)''s local scope.

  - Attempt 4 timed out at the old 150-minute limit. Its work is committed as cc730eb8: snapped generator,
  nested 0.5/0.25/0.125 mm ladder, ValueError off the lattice, GMRES cap 100 x 40, benchmark --vm and
  --sensitivity. Uncommitted edits to l2_layout.py and the note are in the worktree. Read them first and
  build on them; do not re-implement.

  - This run''s wall limit is 240 minutes. Commit as you go: after each working change and after each
  measurement, so a timeout loses nothing.

  - Local scope (this Mac, --quick, which the DoD runs): seed 7 at 2 dies at k_star-1 (0.5 mm) and k_star
  (0.25 mm), and 6 dies at k_star. Three solves. The cost gate at k_star is unchanged.

  - The two sensitivity solves (+2 layers; finer wire edges) and the second-family layout move to the
  --vm run, which the founder runs on the burst VM after merge. Make sure --vm includes them and writes
  everything to cost.json.

  - Run --quick once, in the background, and poll it; do not block on it in the foreground. Then write
  the note with its numbers and report. Do not start the 0.125 mm level on this Mac.


  FOUNDER NOTE for this retry (2026-10-08). The work of attempt 5 passed every DoD check, and both reviews
  (T0088, T0089) accepted it with caveats. It failed only on a one-line merge conflict with main in l2_layout.py
  (the block_gmres call), now resolved by the founder in merge commit ac590646, keeping the branch''s
  line. The fast gate passes on the merged branch (ruff; 348 unit tests).

  This run: confirm the merged branch. Run `uv run pytest -q tests/unit/solvers` and ruff, check that
  main''s changes are present and the branch''s GMRES settings are intact, then report completed with
  a short summary. Do not re-run the benchmark (the orchestrator''s verification runs it) and do not change
  code unless a check fails. Keep the reviewers'' caveats in mind; the founder''s VM run addresses them
  after merge.'
