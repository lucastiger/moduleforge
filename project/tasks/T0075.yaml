- cmd: uv run python -c "import json, math; r=json.load(open('/tmp/l2cost/cost.json')); rows=r['solves'];
    assert rows and {x['dies_per_switch'] for x in rows} >= {2, 6}, rows; assert all(math.isfinite(x['L_H'])
    and 1e-9 < x['L_H'] < 1e-7 for x in rows), rows; bad=[x for x in rows if x['refinement'] == 0 and
    (x['cpu_s'] > 2400 or x['peak_rss_gb'] > 12)]; assert not bad, bad; conv=r['convergence']; assert
    conv and all(abs(c['rel_change']) < 0.01 for c in conv), conv; print([(x['dies_per_switch'], x['refinement'],
    round(x['cpu_s']), x['peak_rss_gb']) for x in rows], conv)"
