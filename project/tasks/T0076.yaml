description: 'Restores T0069 plan node n5 (dropped by the open-task-limit bug; restoration requested by
  the founder on I0032). It re-issues T0024, which was blocked by failed T0022. Draft experiments/drafts/E002.yaml,
  experiments/drafts/E003.yaml, experiments/runners/e002_ranking.py and experiments/runners/e003_timing.py.
  Write research/notes/o001-e002-e003-design.md with the rationale and a power analysis.


  Everything in T0024''s description (project/tasks/T0024.yaml) still applies:

  - sealed seed;

  - strata over all families and 2-6 dies per switch;

  - metrics and bootstrap CIs with a fixed bootstrap seed;

  - the top-decile rounding rule declared in advance;

  - secondary Spearman at 5 and 80 MHz (F4), and residual correlations with loop area, plane distance
  and die count (F3);

  - sanity checks l2_converged, sample_diverse, all_drc_valid, l2_reference_valid and all_finite;

  - exclusions declared in advance;

  - E003 thread pinning, n_evals, warm-up and recorded CPU model;

  - the founder context on L1''s die-count-correlated mesh bias.


  Changes:

  (1) L2 is moduleforge.solvers.l2_layout.loop_inductance. l2_reference_valid re-solves E001''s C1 in
  the run with moduleforge.solvers.l2 and must agree within 2 %.

  (2) Size n from the measured layout cost in research/notes/o001-l2-layout-cost.md and benchmarks/l2_layout_cost.py,
  not from T0067''s estimate, and from the CPU-h O001 has left. State cpu_hours_est and timeout_min honestly.
  Above 6 CPU-h the run goes to burst compute. Under D0004 the in-house L2 needs no FastHenry binary,
  only uv sync. Provenance is tool_version plus the solver-source sha256.

  (3) If no n makes A2/K1 and A4/K2 decidable within the objective''s compute budget, say so in the note
  and stop with status blocked; the founder decides.

  (4) --smoke uses <= 4 layouts at 2 dies per switch from an unsealed dev seed, with the l2_converged
  refinement solve on one layout only. It is a pipeline check only. Never use it to change n, strata,
  metrics or thresholds.

  Do not write under src/.'
