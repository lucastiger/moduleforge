  report:
    summary: 'I''ve written the E002 and E003 drafts, their two runners and the design note. Every definition-of-done
      command exits 0, and the work is committed to the task branch as 09ee20b3.


      **Commands run and exit codes:**

      - `uv run mfos exp check E002`: 0. `uv run mfos exp check E003`: 0.

      - `uv run ruff check` on both runners: 0.

      - E002 `--smoke` plus the DoD assertion: 0 and 0 (1715 s wall, peak RSS 8.0 GB).

      - E003 `--smoke` plus the DoD assertion: 0 and 0.

      - `uv run mfos gate --fast`: 0 ("all gates passed").

      - Also run: the power simulation `research/scripts/e002_power.py` (0) and a code-path harness `research/scripts/e002_runner_harness.py`
      (0).


      **Choice at registration.** The founder''s note asked for E002 at two compute envelopes; the founder
      picks one:

      - **(a) ≤ 60 CPU-h:** 30 layouts and one check layout at the finer level (u_shaped, 6 dies). About
      51 CPU-h and 6.5 VM-hours (~$13). Register cpu_hours_est 52 and timeout_min 600.

      - **(b) ≤ 180 CPU-h:** 90 layouts and three check layouts, one per family. About 158 CPU-h and 18
      VM-hours (~$35). Register cpu_hours_est 158 and timeout_min 1500. **I recommend (b); the draft carries
      it.** If (b) must stay under 180 even at the +25 % cost estimate, set `freq_per_stratum: 0` (about
      143 CPU-h).


      The CPU-h estimates use the VM measurements in `research/l2_layout_vm/cost.json`, not the Mac numbers.


      **Power** (simulated on a dev-seed pool, never the sealed seed):

      - A2 (lower Spearman bound ≥ 0.85) has ≥ 0.8 probability of passing for a population ρ of about
      0.96 or more at 30 layouts, and about 0.94 or more at 90.

      - K1 needs ρ ≤ 0.48 at 30 layouts or ≤ 0.64 at 90.

      - A4 (upper MAPE bound ≤ 0.12) has ≥ 0.8 power for MAPE ≲ 0.08 at 30 layouts and ≲ 0.095 at 90.
      K2 fires reliably at MAPE ≥ 0.25.

      - A5 resolves to 3 layouts at n = 30 and 9 at n = 90.


      So both envelopes can decide the criteria when L1 is clearly good or clearly bad, and I did not
      mark the task blocked.


      **Main finding for the founder: A4 will probably sit at its threshold.** On the three unsealed VM
      dev layouts, L1 reads 7–16 % below L2 at the 0.25 mm level. That gives MAPE ≈ 0.11, or ≈ 0.10 after
      correcting L2''s known bias, right where A4 has little power at either envelope. Correcting L2''s
      bias would lower MAPE by about 1.5 points. Refining L1''s mesh moves L1 further from L2. So the
      gap is not L1''s discretisation; possibly missing physics, though that is speculation from three
      layouts.


      **L2 bias handling.** L2 at the 0.25 mm level is never treated as exact:

      - The bias is estimated per checked layout from three refinement levels, and from the coarser step
      on 15 more layouts.

      - It feeds three things: metrics against a corrected reference, a rigorous MAPE band for A4, and
      recall bounds for near-tied layouts.

      - I could not compute a meaningful ρ or MAPE on 1–3 check layouts. Instead the runner reports each
      checked layout''s error shift between the two levels and whether their order agrees.


      **Things you might not expect:**

      - Pooled Spearman is inflated by family clustering: side_by_side layouts sit far apart from the
      others. The runner reports a within-family ρ as a secondary metric.

      - The plane-distance covariate for F3 varies only through bond-wire height, because the generator
      uses one fixed substrate stack.

      - At envelope (a) there are no L2 data at 5/80 MHz; only L1''s own frequency stability is reported.

      - The packet cites `research/notes/o001-l2-layout-cost.md`, which does not exist. I used `docs/notes/o001-l2-layout-cost.md`.


      The smoke runs and the harness are pipeline checks only. The harness caught one bug before the smoke:
      a lookup that crashed when a frequency had not been solved at that level. I fixed it. No design
      parameter was changed after any run.'
    failure_class: none
    confidence: 0.8
    affects_acceptance_criteria: true
    evidence:
