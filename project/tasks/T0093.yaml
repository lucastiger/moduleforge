description: 'Low priority; do not start before E002''s L2 runs are done, so the layout solver does not
  change under them. From reviews T0088, T0089, T0091 and T0092 of T0075 (project/reviews/T0075/):

  (1) l2_layout''s docstring says the thickness layers resolve the 20 MHz skin depth at every level, but
  backside Cu is 8.3 % off the exact 1-D surface impedance; skin_resolution checks top Cu only. Make the
  check cover every slab, or state the limit precisely.

  (2) The comment above GMRES_RESTART expects ~800-1000 iterations at 0.125 mm; the note says ~430 at
  GMRES_TOL 1e-7. Make them agree with the burst-VM measurement (research/l2_layout_vm/cost.json).

  (3) benchmarks/l2_layout_cost.py run_child drops meta[''source_sha256''], tool_version and the layout
  fingerprint. Record them in every solve so cost.json can be tied to the code that produced it.

  (4) In --quick mode the convergence and sensitivity lists are empty, and all([]) is True, so the script
  exits 0 without checking them. Make the exit status reflect only the gates the mode actually measures.

  Never weaken a test or a gate.'
