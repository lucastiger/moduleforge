[project]
name = "moduleforge"
version = "0.0.1"
description = "Physics-first layout compiler for power modules, plus the mfos research operating system"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "shapely>=2.0",
  "jax>=0.4.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mfos = "mfos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moduleforge", "tools/mfos/mfos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running numerical tests (excluded from the fast gate)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".mfos", "research"]

[tool.ruff.lint]
# Pinned explicitly so the gate does not change meaning when ruff's defaults change.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
