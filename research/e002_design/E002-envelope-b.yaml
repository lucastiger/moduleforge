# E002 ENVELOPE (b) (T0076): <= 180 CPU-h (estimate 158, +-25 %: up to ~198).
# THIS EXCEEDS O001's FROZEN OBJECTIVE BUDGET (project/objectives/O001/objective.yaml: cpu_hours 60) and needs a founder
# budget decision at registration. To register (b), copy this file to experiments/drafts/E002.yaml. It differs from
# envelope (a) in n_layouts 90, freq_per_stratum 1, check_strata (3), the metrics that only exist with >= 2 checked
# layouts and >= 3 frequency-subset layouts, timeout_min and cpu_hours_est. The runner checks that the declared metric
# list matches the config before any solve. Rationale: research/notes/o001-e002-e003-design.md.
id: E002
title: L1 vs L2 commutation-loop inductance ranking on sealed generated half-bridge layouts (20 MHz; 5/80 MHz secondary)
objective: O001
runner: uv run python experiments/runners/e002_ranking.py
config:
  n_layouts: 90
  freq_hz: 2.0e+7
  freqs_secondary_hz: [5.0e+6, 8.0e+7]
  freq_per_stratum: 1
  low_per_stratum: 1
  l2_refinement: 1
  check_strata: ["interleaved:6", "u_shaped:6", "side_by_side:2"]
  conv_tol: 0.01
  l2_tol_max: 1.0e-3
  l2_tol_max_check: 2.0e-3
  contraction_dev: 0.61
  bias_margin: 0.005
  near_tie_min: 0.01
  cv_min: 0.3
  area_tol: 1.0e-9
  l1_hmax_fine_m: [2.0e-3, 1.0e-3, 0.5e-3]
  ref_case: C1
  ref_refinement: 2
  ref_tol: 0.02
  ref_freqs_hz: [5.0e+6, 2.0e+7, 8.0e+7]
  c1_layout_refinement: 1
  c1_layout_cell_m: 0.7e-3
  c1_layout_tol: 0.005
  n_boot: 2000
  boot_seed: 20261008
  jobs: 4
  threads: 8
sealed_seed: true
metrics:
  # ---- primary (A2-A5, K1-K3): 20 MHz, L1 default mesh vs L2 (solvers.l2_layout) at k_star = 1 (0.25 mm)
  - {name: spearman_rho_Lloop, description: "Spearman (average ranks) of L1 and L2 at 20 MHz over all n layouts; paired percentile bootstrap 95 % CI (n_boot 2000, boot_seed 20261008)"}
  - {name: mape_Lloop, description: "mean over layouts of |L1 - L2| / L2 at 20 MHz, L2 at k_star the reference (as the objective defines it); paired percentile bootstrap 95 % CI"}
  - {name: top_decile_recall, description: "mfos.stats.topk_recall: share of L1's k lowest-L layouts among L2's w lowest, k = max(1, round(0.1 n)), w = max(1, round(0.2 n)), round-half-to-even; exact at n % 30 == 0; bootstrap CI reported, A5/K3 read the point"}
  # ---- L2 bias at k_star (founder notes 2026-10-07/08; never treated as zero)
  - {name: l2_bias_kstar_mean, description: "mean over checked layouts of beta = -d2/(1 - r); d1 = (L_k - L_{k-1})/L_k, d2 = (L_{k+1} - L_k)/L_k, r = d2/d1 (geometric extrapolation of the 0.5/0.25/0.125 mm ladder); L2(k*) = L_limit/(1 - beta)"}
  - {name: l2_bias_kstar_max, description: max of the same over checked layouts}
  - {name: l2_contraction_mean, description: mean contraction r over checked layouts}
  - {name: l2_bias_band_lo, description: "lower end of the bias band: min over the refinement subset of each layout's lower estimate (checked: beta; k*-1 only: -d1 r/(1 - r) at both r_min and r_max, ends taken by sign) minus bias_margin. Measured on the refinement subset only"}
  - {name: l2_bias_band_hi, description: "upper end: max of the upper estimates plus bias_margin"}
  - {name: l2_bias_band_loo_coverage, description: "share of refinement-subset layouts whose own bias interval lies inside the band built without them (+ margin): an in-run check of the assumption that the band transfers to unmeasured layouts"}
  - {name: l2_bias_kstar_est_side_by_side, description: mean estimated bias of the family's measured layouts}
  - {name: l2_bias_kstar_est_interleaved, description: same}
  - {name: l2_bias_kstar_est_u_shaped, description: same}
  - {name: spearman_rho_Lloop_l2corr, description: "Spearman against the bias-corrected reference L2 (1 - beta_i) (measured layouts: own estimate; others: mean of their stratum's measured layouts); bootstrap CI"}
  - {name: mape_Lloop_l2corr, description: MAPE against the bias-corrected reference; bootstrap CI}
  - {name: top_decile_recall_l2corr, description: top_decile_recall against the bias-corrected reference}
  - {name: mape_Lloop_refbound_lo, description: "lower 95 % bootstrap bound of mean_i min over beta in [band_lo, band_hi] of |L1/(L2 (1 - beta)) - 1|. Conditional on every layout's bias lying in the band (measured on the refinement subset only; not rigorous for unmeasured layouts)"}
  - {name: mape_Lloop_refbound_hi, description: "upper 95 % bootstrap bound of mean_i max over the band of the same. A4 reads mape_Lloop; reference-robust reading: A4 iff refbound_hi <= 0.12, K2 iff refbound_lo > 0.20, conditional on the band"}
  - {name: near_tie_band, description: "tau = max(near_tie_min, band_hi - band_lo): L2 values closer than tau (relative) are not ordered at k_star"}
  - {name: top_decile_recall_band_lo, description: "recall counting L1-top layouts whose L2 is within tau of L2's top-quintile boundary as outside"}
  - {name: top_decile_recall_band_hi, description: "recall counting them as inside; A5/K3 are reference-robust iff both ends give the same decision"}
  - {name: l2_near_tie_pair_frac, description: share of layout pairs whose L2 values differ by less than tau}
  - {name: ape_shift_kstar_to_kstar1_max, description: "max over checked layouts of | |L1/L2_k* - 1| - |L1/L2_k*+1 - 1| | (sensitivity of the APE to the reference level)"}
  - {name: check_pairs_concordant_frac, description: share of checked-layout pairs ordered the same by L2 at k_star and k_star+1}
  # ---- secondary: representativeness, F4, F3, L1 mesh bias, cost
  - {name: spearman_rho_within_family, description: "mean over the 3 families of the within-family Spearman (L1 vs L2, 20 MHz); bootstrap CI"}
  - {name: cv_L2, description: "diversity statistic (F2): coefficient of variation of L2 at 20 MHz"}
  - {name: cv_loop_area, description: coefficient of variation of loop_area_proxy}
  - {name: spearman_L1_5MHz_vs_20MHz, description: "F4: rank stability of L1 itself, 5 vs 20 MHz, all layouts; bootstrap CI"}
  - {name: spearman_L1_80MHz_vs_20MHz, description: "F4: rank stability of L1 itself, 80 vs 20 MHz, all layouts; bootstrap CI"}
  - {name: spearman_rho_Lloop_20MHz_sub, description: Spearman L1 vs L2 at 20 MHz on the frequency subset (like-for-like with 5/80 MHz)}
  - {name: spearman_rho_Lloop_5MHz, description: "F4: Spearman L1 vs L2 at 5 MHz, frequency subset; bootstrap CI"}
  - {name: spearman_rho_Lloop_80MHz, description: "F4: Spearman L1 vs L2 at 80 MHz, frequency subset; bootstrap CI"}
  - {name: mape_Lloop_5MHz, description: MAPE at 5 MHz on the frequency subset; bootstrap CI}
  - {name: mape_Lloop_80MHz, description: MAPE at 80 MHz on the frequency subset; bootstrap CI}
  - {name: spearman_L2_5MHz_vs_20MHz, description: "F4: rank stability of L2 itself, 5 vs 20 MHz; bootstrap CI"}
  - {name: spearman_L2_80MHz_vs_20MHz, description: "F4: rank stability of L2 itself, 80 vs 20 MHz; bootstrap CI"}
  - {name: resid_spearman_loop_area, description: "F3: Spearman of (L1 - L2)/L2 (L1 default mesh) with loop_area_proxy; bootstrap CI"}
  - {name: resid_spearman_plane_dist, description: "F3: same with plane_dist_proxy (mean wire apex height above the backside-Cu top face; the stack is fixed, so this probes wire height only)"}
  - {name: resid_spearman_dies, description: "F3: same with dies_per_switch"}
  - {name: resid_fine_spearman_loop_area, description: "F3 with L1 at hmax 0.5 mm (separates L1's discretisation bias from missing physics)"}
  - {name: resid_fine_spearman_plane_dist, description: same with plane_dist_proxy}
  - {name: resid_fine_spearman_dies, description: same with dies_per_switch}
  - {name: l1_mesh_bias_mean, description: "mean of L1(default 4 mm)/L1(0.5 mm) - 1 at 20 MHz"}
  - {name: l1_mesh_bias_spearman_dies, description: "Spearman of L1's mesh bias with dies_per_switch; bootstrap CI"}
  - {name: cpu_hours_total, description: "user+sys CPU-h of all L2 children plus the parent (cost accounting, not a result)"}
  - {name: l2_wall_hours, description: wall hours of the L2 phases}
sanity_checks:
  - {name: all_drc_valid, description: "moduleforge.drc.check reports no violation, and every trace, plane outline and die footprint lies on the L2 lattice of every solved level (k*-1, k*, k*+1); checked before any solve"}
  - {name: l2_reference_valid, description: "E001's C1 re-solved in-run with moduleforge.solvers.l2 at refinement 2, 5/20/80 MHz: max |L - closed form|/closed form <= 2 %, GMRES converged, and e001_reference.py (the closed form) has the sha256 registered in experiments/specs/E001.yaml"}
  - {name: l2_layout_reference_valid, description: "E001's C1 assembled from the solvers.l2_layout internals (as test_c1_layout_internals_vs_l2_solve_same_refinement: refinement 1, 0.7 mm cells, 20 MHz): |L_layout/L_l2.solve(same refinement) - 1| <= 0.5 % and |L_layout/closed form - 1| <= 2 %, GMRES converged, the layout path's solver_tol_rel_L <= 0.5 % (below the comparison tolerance) and l2's < 1e-5 (as the unit test). Lattice mapping, contacts and die shorts are covered by all_drc_valid and l2_solver_ok"}
  - {name: l2_converged, description: "every checked layout: |d2| + solver_tol(k*) + solver_tol(k*+1) < 1 % and contracting (0 < d2/d1 < 1, or |d2| < 1e-4); every other k*-1 layout: predicted step r_max |d1| < 1 %. Evaluated on the checked layouts first (phase-1 gate: if it fails no other solve starts). A small step, not a small error: the residual bias is reported by the bias metrics"}
  - {name: l2_solver_ok, description: "every L2 layout solve: GMRES flags 0; solver_tol_rel_L_max <= 1e-3 (k*, k*-1), <= 2e-3 (k*+1); represented copper area of every net and plane equal to the exact area (rel <= 1e-9); one die short per die, each on a single net"}
  - {name: l2_provenance_consistent, description: "every L2 child (layouts and the C1 layout-path solve) reports the parent's l2_layout tool_version and source_sha256, unchanged from start to end"}
  - {name: all_finite, description: "every L1 and L2 inductance finite and > 0, no L2 child failed, nothing aborted (a failed solve invalidates the run; nothing is dropped)"}
  - {name: sample_diverse, description: "CV of L2 at 20 MHz >= 0.3 (F2, on the 0.5 mm grid-snapped generator) and every (family, dies 2-6) stratum holds exactly n/15 layouts"}
timeout_min: 1500
cpu_hours_est: 158
